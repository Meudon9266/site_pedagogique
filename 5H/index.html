<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ressources et exercices interactifs pour la 5H.">
  <title>5H · Site pédagogique</title>
  <style>
    :root{--ink:#193247;--muted:#587083;--blue:#21669c;--blue-dark:#174b75;--line:#d6e4ed;--paper:#fff}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:linear-gradient(145deg,#f8fbfd 0%,#e8f2f7 100%)}
    header{background:rgba(255,255,255,.92);border-bottom:1px solid var(--line)}
    .bar,main{width:min(100% - 32px,960px);margin-inline:auto}
    .bar{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:70px;font-weight:700}
    .home{color:var(--blue);text-decoration:none}.home:hover{text-decoration:underline}
    main{padding:48px 0 72px}
    .label{margin:0 0 12px;color:var(--blue);font-weight:700;letter-spacing:.09em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(2.2rem,7vw,3.8rem);line-height:1.05;letter-spacing:-.04em}
    .intro{max-width:650px;margin:18px 0 36px;color:var(--muted);font-size:1.08rem;line-height:1.6}
    .card{display:flex;flex-direction:column;max-width:640px;min-height:260px;padding:28px;border:1px solid var(--line);border-radius:18px;background:var(--paper);box-shadow:0 12px 35px rgba(25,50,71,.08)}
    .tag{margin:0 0 18px;color:var(--blue);font-size:.82rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
    h2{margin:0 0 12px;font-size:1.55rem;line-height:1.2}
    .card p:not(.tag){margin:0 0 24px;color:var(--muted);line-height:1.55}
    .button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;margin-top:auto;padding:12px 18px;border-radius:10px;background:var(--blue);color:#fff;font-weight:700;text-decoration:none}
    .button:hover,.button:focus-visible{background:var(--blue-dark)}
    .button:focus-visible,.home:focus-visible{outline:3px solid #8fcce0;outline-offset:3px}
    @media(max-width:560px){.bar{align-items:flex-start;flex-direction:column;padding:16px 0}.card{padding:22px}}
  </style>
</head>
<body>
  <header><div class="bar"><span>Site pédagogique · 5H</span><a class="home" href="../index.html">Retour à l’accueil</a></div></header>
  <main>
    <p class="label">5H</p>
    <h1>Choisir une matière</h1>
    <p class="intro">Retrouvez les activités interactives préparées pour le niveau 5H.</p>
    <article class="card">
      <p class="tag">Grammaire · jeu de parcours</p>
      <h2>Français</h2>
      <p>Travailler la phrase, le sujet, le prédicat et les compléments à travers un jeu de plateau interactif.</p>
      <a class="button" href="Francais/index.html">Ouvrir le français 5H</a>
    </article>
  </main>
</body>
</html>
