<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aimer et finir — parcours</title>
  <style>
    :root { --encre:#1f3251; --texte:#76593b; --fond:#fff9ec; --rose:#f9e9dc; --carte:#fffdf7; --or:#c7a662; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--encre); background:radial-gradient(circle at 8% 8%,rgba(242,191,176,.28),transparent 34%),linear-gradient(110deg,var(--rose),var(--fond) 58%,#fffaf0); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(900px,92%); margin:0 auto; padding:38px 0 60px; }
    .retour { display:inline-flex; align-items:center; gap:8px; margin-bottom:30px; color:var(--encre); font-weight:800; text-decoration:none; }
    .retour:hover { text-decoration:underline; }
    h1 { margin:0; font-size:clamp(2.6rem,6vw,5.2rem); line-height:1; letter-spacing:-.04em; }
    .intro { max-width:800px; margin:20px 0 34px; color:var(--texte); font-size:clamp(1.05rem,1.8vw,1.35rem); line-height:1.5; font-weight:600; }
    .carte { padding:28px; border:2px solid rgba(199,166,98,.62); border-radius:12px; background:rgba(255,253,247,.9); }
    .etiquette { display:inline-block; margin:0 0 16px; padding:6px 10px; border-radius:999px; color:#fff; background:var(--encre); font-size:.84rem; font-weight:850; }
    h2 { margin:0 0 10px; font-size:clamp(1.45rem,2.4vw,2rem); }
    .description { margin:0; color:var(--texte); line-height:1.55; font-weight:600; }
    .retour:focus-visible { outline:4px solid rgba(31,50,81,.28); outline-offset:4px; }
  </style>
</head>
<body>
  <main>
    <a class="retour" href="index.html">← Retour au parcours</a>
    <h1>Aimer et finir</h1>
    <p class="intro">Les temps de l’indicatif avec deux verbes modèles des premier et deuxième groupes.</p>
    <section class="carte">
      <span class="etiquette">Nouveau parcours</span>
      <h2>Activités à venir</h2>
      <p class="description">Les cours et exercices consacrés à <strong>aimer</strong> et <strong>finir</strong> seront ajoutés sur cette page.</p>
    </section>
  </main>
</body>
</html>
