<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Éditeur de données</title>
<style>
  :root {
    --fond: #fbf9f4; --texte: #26231f; --doux: #6b655b; --carte: #ffffff;
    --bord: #d9d2c3; --accent: #9a4a2b; --accent-texte: #ffffff;
    --ok: #2f7a4f; --ko: #b3382c; --ko-fond: #fbe9e6; --moyen: #8a6a12;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fond: #1c1a17; --texte: #ece7dc; --doux: #a59d8d; --carte: #26231f;
      --bord: #3f3a32; --accent: #d98458; --accent-texte: #1c1a17;
      --ok: #7ccf9c; --ko: #f08a7e; --ko-fond: #3a2220; --moyen: #e5c36a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fond); color: var(--texte); font: 16px/1.45 Georgia, 'Times New Roman', serif; }
  header.haut { position: sticky; top: 0; z-index: 5; background: var(--fond); border-bottom: 1px solid var(--bord); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  header.haut h1 { font-size: 1.1rem; margin: 0; flex: 1 1 auto; }
  #etat { font-size: .9rem; color: var(--doux); } #etat.modif { color: var(--moyen); font-weight: bold; } #etat.ok { color: var(--ok); }
  .mise { display: grid; grid-template-columns: minmax(220px, 290px) 1fr; gap: 16px; max-width: 1150px; margin: 0 auto; padding: 16px; }
  @media (max-width: 760px) { .mise { grid-template-columns: 1fr; } }
  nav.liste { background: var(--carte); border: 1px solid var(--bord); border-radius: 8px; padding: 8px; align-self: start; }
  nav.liste h2 { font-size: .85rem; text-transform: uppercase; letter-spacing: .04em; color: var(--doux); margin: 10px 6px 4px; }
  nav.liste button.item { display: flex; width: 100%; justify-content: space-between; gap: 6px; text-align: left; border: 0; background: transparent; padding: 7px 8px; border-radius: 6px; }
  nav.liste button.item:hover { background: var(--fond); }
  nav.liste button.item.actif { background: var(--accent); color: var(--accent-texte); }
  .pastille { font-size: .75rem; padding: 0 6px; border-radius: 10px; background: var(--ko); color: #fff; align-self: center; }
  .horscours { font-size: .7rem; padding: 0 6px; border-radius: 10px; background: var(--moyen); color: #fff; align-self: center; }
  section.fiche { background: var(--carte); border: 1px solid var(--bord); border-radius: 8px; padding: 16px; min-width: 0; }
  section.fiche h2 { margin: 0 0 12px; font-size: 1.2rem; }
  h3 { font-size: 1rem; margin: 20px 0 6px; }
  label.champ { display: block; margin: 10px 0; font-weight: bold; font-size: .92rem; }
  label.champ small, .aide { font-weight: normal; color: var(--doux); }
  .aide { font-size: .9rem; margin: 2px 0 6px; }
  input[type=text], input[type=number], textarea, select { width: 100%; font: inherit; color: inherit; background: var(--fond); border: 1px solid var(--bord); border-radius: 6px; padding: 6px 8px; }
  textarea { resize: vertical; min-height: 2.6em; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); }
  button { font: inherit; cursor: pointer; border: 1px solid var(--bord); background: var(--carte); color: var(--texte); border-radius: 8px; padding: 6px 12px; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button.primaire { background: var(--accent); color: var(--accent-texte); border-color: var(--accent); }
  button.danger:hover { border-color: var(--ko); color: var(--ko); }
  button.petit { padding: 3px 9px; font-size: .9rem; }
  .ligne { display: flex; gap: 8px; align-items: flex-start; margin: 6px 0; flex-wrap: wrap; }
  .ligne > .grow { flex: 1 1 180px; min-width: 0; } .ligne > .etroit { flex: 0 0 120px; }
  .bloc { border: 1px solid var(--bord); border-radius: 8px; padding: 8px 10px; margin: 8px 0; background: var(--fond); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; padding-top: 12px; border-top: 1px solid var(--bord); }
  #problemes { margin: 0 0 12px; padding: 8px 12px 8px 28px; background: var(--ko-fond); border: 1px solid var(--ko); border-radius: 8px; }
  #problemes[hidden], #accueil[hidden], .mise[hidden], #manuel[hidden], header.haut[hidden] { display: none; }
  #problemes a { color: inherit; }
  #accueil { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
  #manuel { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--bord); color: var(--doux); }
</style>
<meta name="robots" content="noindex, nofollow">
<style>[hidden]{display:none!important}</style>
</head>
<body>

<header class="haut" id="haut" hidden>
  <h1 id="titre-page">Éditeur</h1>
  <span id="etat">Aucune modification</span>
  <button id="b-enregistrer" class="primaire">Enregistrer le JSON</button>
</header>

<div id="accueil">
  <h1>Éditeur de données</h1>
  <p id="accueil-msg">Chargement du fichier de données…</p>
  
</div>

<div class="mise" id="mise" hidden>
  <nav class="liste" id="nav" aria-label="Sections"></nav>
  <div>
    <ul id="problemes" hidden></ul>
    <section class="fiche" id="fiche"></section>
  </div>
</div>

<div id="manuel" hidden>
    <p>Le fichier <strong id="manuel-nom"></strong> n'a pas pu être chargé automatiquement (ouverture locale de la page, par exemple). Choisis-le toi-même :</p>
    <p><input type="file" id="manuel-fichier" accept=".json,application/json"></p>
    <p id="manuel-raison"></p>
  </div>
<script>
(function () {
  var LOCAL = typeof location !== 'undefined' && location.protocol === 'file:';
  var CACHE = 'donnees-v1:' + (typeof location !== 'undefined' ? decodeURIComponent(location.pathname.split('/').pop()) : 'test');
  function memoriser(obj) { if (LOCAL) { try { localStorage.setItem(CACHE, JSON.stringify(obj)); } catch(e) {} } }
  function lireDonnees(url, options) {
    if (LOCAL) { try { var c = localStorage.getItem(CACHE); if(c) return Promise.resolve({ok:true,json:function(){return Promise.resolve(JSON.parse(c));}}); } catch(e) {} }
    return fetch(url, options);
  }

  'use strict';

  /* Racine = nom de CETTE page avant le premier point : « racine.editeur.html » → données dans « racine.json ». */
  var RACINE = decodeURIComponent(location.pathname.split('/').pop() || '').split('.')[0];
  var NOM_JSON = RACINE + '.json';
  var TYPES = [['intro', 'Introduction (texte)'], ['placer', 'Placer des cartes dans des zones'], ['multiple', 'Cases à cocher (vrai / faux, ordre mélangé)'], ['choix', 'Choix (une seule bonne réponse)'], ['synthese', 'Synthèse (tableau récapitulatif automatique)']];
  var PRES = [['frise', 'Frise : événements propres à une période (colonnes)'], ['fil', 'Fil : phénomène qui traverse les périodes (bandeau)'], ['tri', 'Tri : deux boîtes']];

  var data = null, courant = 'general', modifie = false, handle = null;
  function $(id) { return document.getElementById(id); }

  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'texte') e.textContent = attrs[k];
      else if (k === 'classe') e.className = attrs[k];
      else if (k.slice(0, 2) === 'on') e[k] = attrs[k];
      else e.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function marquer() { modifie = true; var s = $('etat'); s.textContent = 'Modifications non enregistrées'; s.className = 'modif'; verifierEtMontrer(); }
  function slug(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, ''); }
  function champ(etiquette, valeur, surChange, opts) {
    opts = opts || {};
    var s = opts.multi ? el('textarea', { rows: opts.rows || 2 }) : el('input', { type: opts.nombre ? 'number' : 'text', step: 'any' });
    s.value = valeur == null ? '' : valeur;
    s.addEventListener('input', function () { surChange(opts.nombre ? (s.value === '' ? '' : Number(s.value)) : s.value); marquer(); });
    return el('label', { classe: 'champ' }, [etiquette, opts.aide ? el('small', { texte: ' — ' + opts.aide }) : null, s]);
  }
  function choisir(etiquette, valeur, options, surChange) {
    var s = el('select');
    options.forEach(function (o) { var x = el('option', { value: o[0], texte: o[1] }); if (o[0] === valeur) x.selected = true; s.appendChild(x); });
    s.addEventListener('change', function () { surChange(s.value); marquer(); });
    return el('label', { classe: 'champ' }, [etiquette, s]);
  }
  function liste(f, titre, aide, tab, dessinerLigne, nouveau, etiquetteAjout) {
    f.appendChild(el('h3', { texte: titre }));
    if (aide) f.appendChild(el('p', { classe: 'aide', texte: aide }));
    var zone = el('div'); f.appendChild(zone);
    function dessiner() {
      zone.textContent = '';
      tab.forEach(function (x, i) {
        var sup = el('button', { classe: 'petit danger', type: 'button', texte: '✕', title: 'Supprimer', onclick: function () { tab.splice(i, 1); marquer(); dessiner(); } });
        zone.appendChild(el('div', { classe: 'bloc' }, [el('div', { classe: 'ligne' }, [el('div', { classe: 'grow', style: 'flex-basis:100%' }, [dessinerLigne(x, i, dessiner)]), sup])]));
      });
    }
    dessiner();
    f.appendChild(el('button', { classe: 'petit', type: 'button', texte: etiquetteAjout || '+ Ajouter', onclick: function () { tab.push(nouveau()); marquer(); dessiner(); } }));
  }
  function listeTextes(f, titre, aide, tab, rows, ajout) {
    liste(f, titre, aide, tab, function (x, i) {
      var t = el('textarea', { rows: rows || 3 }); t.value = x; t.addEventListener('input', function () { tab[i] = t.value; marquer(); }); return t;
    }, function () { return ''; }, ajout || '+ Ajouter un paragraphe');
  }
  function trouverEcran(id) { for (var i = 0; i < data.ecrans.length; i++) if (data.ecrans[i].id === id) return data.ecrans[i]; return null; }
  function idsZones(e) { return (e.zones || []).map(function (z) { return typeof z === 'string' ? z : z.id; }); }

  /* ---------- validation ---------- */
  function verifier() {
    var pb = [], per = {}, ids = {};
    data.periodes.forEach(function (p) {
      if (!p.id) pb.push({ cible: 'periodes', msg: 'Une période n\'a pas d\'identifiant.' });
      if (per[p.id]) pb.push({ cible: 'periodes', msg: 'Période « ' + p.id + ' » en double.' }); per[p.id] = true;
      if (!p.titre) pb.push({ cible: 'periodes', msg: 'Période « ' + p.id + ' » : titre vide.' });
    });
    data.ecrans.forEach(function (e) {
      function p(m) { pb.push({ cible: e.id, msg: 'Écran « ' + (e.id || '?') + ' » : ' + m }); }
      if (!e.id) p('identifiant vide.'); if (ids[e.id]) p('identifiant en double.'); ids[e.id] = true;
      if (e.type !== 'intro' && e.type !== 'synthese' && !e.question) p('question vide.');
      if (e.type === 'placer') {
        var zs = idsZones(e);
        if (!zs.length) p('aucune zone.');
        (e.zones || []).forEach(function (z) { if (typeof z === 'string' && !per[z]) p('période inconnue « ' + z + ' ».'); });
        if (!(e.cartes || []).length) p('aucune carte.');
        (e.cartes || []).forEach(function (c, i) {
          if (!c.texte) p('carte n° ' + (i + 1) + ' sans texte.');
          if (zs.indexOf(c.zone) < 0) p('la carte n° ' + (i + 1) + ' pointe vers une zone absente.');
        });
      }
      if (e.type === 'choix') { if ((e.options || []).length < 2) p('au moins 2 options.'); else if (!e.options.some(function (o) { return o.id === e.bonne; })) p('la bonne réponse n\'est pas choisie.'); }
      if (e.type === 'multiple') { if ((e.options || []).length < 3) p('au moins 3 options.'); else if (!e.options.some(function (o) { return o.juste; })) p('aucune option n\'est « vraie ».'); }
    });
    return pb;
  }
  function verifierEtMontrer() {
    var pb = verifier(), ul = $('problemes');
    ul.textContent = ''; ul.hidden = pb.length === 0;
    pb.forEach(function (x) { var a = el('a', { href: '#', texte: x.msg }); a.addEventListener('click', function (ev) { ev.preventDefault(); aller(x.cible); }); ul.appendChild(el('li', {}, [a])); });
    var par = {}; pb.forEach(function (x) { par[x.cible] = (par[x.cible] || 0) + 1; });
    Array.prototype.forEach.call($('nav').querySelectorAll('button.item'), function (b) {
      var o = b.querySelector('.pastille'); if (o) o.remove();
      if (par[b.getAttribute('data-id')]) b.appendChild(el('span', { classe: 'pastille', texte: String(par[b.getAttribute('data-id')]) }));
    });
  }

  /* ---------- navigation ---------- */
  function aller(id) { courant = id; dessinerNav(); dessinerFiche(); verifierEtMontrer(); window.scrollTo(0, 0); }
  function aHorsCours(e) {
    return !!e.hors_cours || (e.cartes || []).some(function (c) { return c.hors_cours; }) || (e.options || []).some(function (o) { return o.hors_cours; });
  }
  function dessinerNav() {
    var nav = $('nav'); nav.textContent = '';
    function item(id, t, hc) { var b = el('button', { classe: 'item' + (id === courant ? ' actif' : ''), 'data-id': id, type: 'button' }, [el('span', { texte: t }), hc ? el('span', { classe: 'horscours', texte: 'hors cours', title: 'Contient du contenu hors du dossier de l\'élève' }) : null]); b.addEventListener('click', function () { aller(id); }); return b; }
    nav.appendChild(el('h2', { texte: 'Général' }));
    nav.appendChild(item('general', 'Titre et consigne'));
    nav.appendChild(item('periodes', 'Périodes (' + data.periodes.length + ')'));
    nav.appendChild(item('conclusion', 'Conclusion'));
    nav.appendChild(el('h2', { texte: 'Écrans (' + data.ecrans.length + ')' }));
    data.ecrans.forEach(function (e, i) { nav.appendChild(item(e.id, (i + 1) + '. ' + (e.titre || e.id || '?'), aHorsCours(e))); });
    nav.appendChild(el('button', { classe: 'primaire', type: 'button', texte: '+ Nouvel écran', style: 'width:100%;margin-top:10px', onclick: nouvelEcran }));
  }
  function dessinerFiche() {
    var f = $('fiche'); f.textContent = '';
    if (courant === 'general') return ficheGenerale(f);
    if (courant === 'periodes') return fichePeriodes(f);
    if (courant === 'conclusion') return ficheConclusion(f);
    var e = trouverEcran(courant); if (!e) { courant = 'general'; return ficheGenerale(f); }
    ficheEcran(f, e);
  }

  /* ---------- fiches ---------- */
  function ficheGenerale(f) {
    f.appendChild(el('h2', { texte: 'Titre et consigne' }));
    f.appendChild(champ('Titre de l\'activité', data.titre, function (v) { data.titre = v; }));
    f.appendChild(champ('Consigne de départ', data.consigne, function (v) { data.consigne = v; }, { multi: true, rows: 3 }));
    f.appendChild(el('p', { classe: 'aide', texte: 'Le bloc « _aide » (notice du fichier) est conservé tel quel.' }));
  }
  function fichePeriodes(f) {
    f.appendChild(el('h2', { texte: 'Les périodes de la frise' }));
    f.appendChild(el('p', { classe: 'aide', texte: 'La couleur (teinte de 0 à 360) colore la période partout : 28 orange, 205 bleu, 355 rouge, 265 violet, 145 vert.' }));
    liste(f, 'Périodes', null, data.periodes, function (p) {
      var idc = el('input', { type: 'text' }); idc.value = p.id || '';
      idc.addEventListener('change', function () {
        var neuf = slug(idc.value) || p.id; if (neuf === p.id) { idc.value = p.id; return; }
        if (data.periodes.some(function (q) { return q !== p && q.id === neuf; })) { alert('Identifiant déjà pris.'); idc.value = p.id; return; }
        data.ecrans.forEach(function (e) {
          if (e.zones) e.zones = e.zones.map(function (z) { return z === p.id ? neuf : z; });
          (e.cartes || []).forEach(function (c) { if (c.zone === p.id) c.zone = neuf; });
        });
        p.id = neuf; idc.value = neuf; marquer(); dessinerNav();
      });
      return el('div', {}, [
        el('div', { classe: 'ligne' }, [el('div', { classe: 'etroit' }, [el('small', { texte: 'Identifiant' }), idc]), el('div', { classe: 'grow' }, [champ('Titre', p.titre, function (v) { p.titre = v; })]), el('div', { classe: 'grow' }, [champ('Dates', p.dates, function (v) { p.dates = v; })]), el('div', { classe: 'etroit' }, [champ('Teinte', p.teinte, function (v) { p.teinte = v; }, { nombre: true })])]),
        champ('Résumé (affiché au début)', p.resume, function (v) { p.resume = v; }, { multi: true, rows: 3 })
      ]);
    }, function () { return { id: 'p' + (data.periodes.length + 1), titre: 'Nouvelle période', dates: '', resume: '', teinte: 100 }; }, '+ Nouvelle période');
  }
  function ficheConclusion(f) {
    data.conclusion = data.conclusion || { titre: 'Ce que tu as découvert', points: [] };
    var c = data.conclusion; c.points = c.points || [];
    f.appendChild(el('h2', { texte: 'Conclusion' }));
    f.appendChild(champ('Titre', c.titre, function (v) { c.titre = v; }));
    listeTextes(f, 'Points affichés à la fin', 'Les principales choses découvertes.', c.points, 2, '+ Ajouter un point');
  }

  function reponseEditeur(f, e) {
    e.reponse = e.reponse || {};
    var r = e.reponse; r.paragraphes = r.paragraphes || [];
    f.appendChild(el('h3', { texte: 'Le mini-cours affiché après la correction' }));
    f.appendChild(champ('Titre', r.titre, function (v) { r.titre = v; }));
    listeTextes(f, 'Paragraphes', 'Explique comme dans un cours.', r.paragraphes, 3);
    f.appendChild(champ('À retenir (une phrase)', r.a_retenir, function (v) { if (v) r.a_retenir = v; else delete r.a_retenir; }, { multi: true }));
  }

  function ficheEcran(f, e) {
    f.appendChild(el('h2', { texte: 'Écran « ' + e.id + ' »' }));
    var idc = el('input', { type: 'text' }); idc.value = e.id;
    idc.addEventListener('change', function () {
      var neuf = slug(idc.value); if (neuf === e.id) { idc.value = e.id; return; }
      if (!neuf || trouverEcran(neuf)) { alert('Identifiant vide ou déjà pris.'); idc.value = e.id; return; }
      e.id = neuf; courant = neuf; marquer(); dessinerNav(); dessinerFiche();
    });
    f.appendChild(el('label', { classe: 'champ' }, ['Identifiant ', el('small', { texte: '— court, sans accent, unique' }), idc]));
    f.appendChild(choisir('Type d\'écran', e.type, TYPES, function (v) { e.type = v; initType(e); dessinerFiche(); }));
    f.appendChild(champ('Titre court', e.titre, function (v) { e.titre = v; }, { aide: 'sert de nom de ligne dans le tableau de synthèse pour un « fil »' }));

    if (e.type === 'intro' || e.type === 'synthese') {
      e.paragraphes = e.paragraphes || [];
      listeTextes(f, 'Texte', null, e.paragraphes, 4);
      if (e.type === 'intro') f.appendChild(choisir('Afficher les périodes sous le texte', e.afficher || '', [['', 'Non'], ['frise', 'Oui (bandeau des périodes)']], function (v) { if (v) e.afficher = v; else delete e.afficher; }));
    } else {
      f.appendChild(champ('Question posée à l\'élève', e.question, function (v) { e.question = v; }, { multi: true, rows: 3 }));
    }

    if (e.type === 'placer') {
      f.appendChild(choisir('Présentation', e.presentation, PRES, function (v) { e.presentation = v; }));
      e.zones = e.zones || []; e.cartes = e.cartes || [];
      liste(f, 'Zones', 'Une zone est une période de la frise, ou une zone personnalisée (boîte). Dans l\'ordre d\'affichage.', e.zones, function (z, i, redessiner) {
        if (typeof z === 'string') {
          var s = el('select');
          data.periodes.forEach(function (p) { var o = el('option', { value: p.id, texte: p.titre + ' (' + p.id + ')' }); if (p.id === z) o.selected = true; s.appendChild(o); });
          s.addEventListener('change', function () { var ancien = e.zones[i]; e.zones[i] = s.value; e.cartes.forEach(function (c) { if (c.zone === ancien) c.zone = s.value; }); marquer(); });
          return el('div', { classe: 'ligne' }, [el('div', { classe: 'etroit' }, [el('small', { texte: 'Période' })]), el('div', { classe: 'grow' }, [s])]);
        }
        var idz = el('input', { type: 'text' }); idz.value = z.id || '';
        idz.addEventListener('change', function () { var neuf = slug(idz.value) || z.id; e.cartes.forEach(function (c) { if (c.zone === z.id) c.zone = neuf; }); z.id = neuf; idz.value = neuf; marquer(); });
        return el('div', { classe: 'ligne' }, [
          el('div', { classe: 'etroit' }, [el('small', { texte: 'Identifiant' }), idz]),
          el('div', { classe: 'grow' }, [champ('Titre', z.titre, function (v) { z.titre = v; })]),
          el('div', { classe: 'grow' }, [champ('Sous-titre', z.sous, function (v) { z.sous = v; })]),
          el('div', { classe: 'etroit' }, [champ('Teinte', z.teinte, function (v) { if (v === '') delete z.teinte; else z.teinte = v; }, { nombre: true })])]);
      }, function () { return data.periodes[0] ? data.periodes[0].id : 'zone'; }, '+ Ajouter une période comme zone');
      f.appendChild(el('button', { classe: 'petit', type: 'button', style: 'margin-left:8px', texte: '+ Ajouter une zone personnalisée', onclick: function () { e.zones.push({ id: 'zone' + (e.zones.length + 1), titre: 'Nouvelle zone', sous: '' }); marquer(); dessinerFiche(); } }));
      liste(f, 'Cartes à placer', 'Chaque carte a sa bonne zone et une explication affichée à la correction. Coche « hors cours » si elle ne vient pas du dossier de l\'élève (c\'est un repère pour toi, l\'élève ne le voit pas).', e.cartes, function (c) {
        var sz = el('select');
        idsZones(e).forEach(function (zid) { var o = el('option', { value: zid, texte: zid }); if (zid === c.zone) o.selected = true; sz.appendChild(o); });
        sz.addEventListener('change', function () { c.zone = sz.value; marquer(); });
        var hc = el('input', { type: 'checkbox' }); hc.checked = !!c.hors_cours;
        hc.addEventListener('change', function () { if (hc.checked) c.hors_cours = true; else delete c.hors_cours; marquer(); dessinerNav(); });
        return el('div', {}, [
          champ('Texte de la carte', c.texte, function (v) { c.texte = v; }, { multi: true, rows: 2 }),
          el('div', { classe: 'ligne' }, [el('div', { classe: 'grow' }, [el('label', { classe: 'champ' }, ['Bonne zone', sz])]), el('label', {}, [hc, ' hors cours'])]),
          champ('Explication à la correction', c.explication, function (v) { c.explication = v; }, { multi: true, rows: 3 })
        ]);
      }, function () { return { id: 'c' + (e.cartes.length + 1), texte: '', zone: idsZones(e)[0] || '', explication: '' }; }, '+ Ajouter une carte');
    }
    if (e.type === 'choix') {
      e.options = e.options || [];
      liste(f, 'Options', 'Une seule est la bonne : coche-la.', e.options, function (o) {
        var r = el('input', { type: 'radio', name: 'bonne-' + e.id }); r.checked = o.id === e.bonne;
        r.addEventListener('change', function () { e.bonne = o.id; marquer(); });
        var idc2 = el('input', { type: 'text' }); idc2.value = o.id || '';
        idc2.addEventListener('change', function () { var was = e.bonne === o.id; o.id = slug(idc2.value) || o.id; idc2.value = o.id; if (was) e.bonne = o.id; marquer(); });
        var t = el('textarea', { rows: 2 }); t.value = o.texte || ''; t.addEventListener('input', function () { o.texte = t.value; marquer(); });
        return el('div', { classe: 'ligne' }, [el('div', { classe: 'etroit' }, [el('small', { texte: 'id' }), idc2]), el('div', { classe: 'grow' }, [t]), el('label', {}, [r, ' bonne'])]);
      }, function () { return { id: 'o' + (e.options.length + 1), texte: '' }; }, '+ Ajouter une option');
    }
    if (e.type === 'multiple') {
      e.options = e.options || [];
      var mel = el('input', { type: 'checkbox' }); mel.checked = e.melanger !== false;
      mel.addEventListener('change', function () { if (mel.checked) delete e.melanger; else e.melanger = false; marquer(); });
      f.appendChild(el('label', { style: 'display:block;margin:8px 0' }, [mel, ' Mélanger l\'ordre des propositions à chaque partie (recommandé)']));
      liste(f, 'Options', 'Coche « vrai » pour les propositions que l\'élève doit cocher. Écris une explication pour chacune : elle s\'affiche à la correction.', e.options, function (o) {
        var cb = el('input', { type: 'checkbox' }); cb.checked = !!o.juste; cb.addEventListener('change', function () { o.juste = cb.checked; marquer(); });
        var hc = el('input', { type: 'checkbox' }); hc.checked = !!o.hors_cours;
        hc.addEventListener('change', function () { if (hc.checked) o.hors_cours = true; else delete o.hors_cours; marquer(); dessinerNav(); });
        var t = el('textarea', { rows: 2 }); t.value = o.texte || ''; t.addEventListener('input', function () { o.texte = t.value; marquer(); });
        var n = el('textarea', { rows: 2, placeholder: 'Explication affichée à la correction (vrai ou faux)' }); n.value = o.note || '';
        n.addEventListener('input', function () { if (n.value) o.note = n.value; else delete o.note; marquer(); });
        return el('div', {}, [el('div', { classe: 'ligne' }, [el('div', { classe: 'grow' }, [t]), el('label', {}, [cb, ' vrai']), el('label', {}, [hc, ' hors cours'])]), n]);
      }, function () { return { id: 'o' + (e.options.length + 1), texte: '', juste: false }; }, '+ Ajouter une option');
    }
    if (e.type === 'placer' || e.type === 'choix' || e.type === 'multiple') reponseEditeur(f, e);

    var i = data.ecrans.indexOf(e), actions = el('div', { classe: 'actions' });
    actions.appendChild(el('button', { type: 'button', texte: 'Dupliquer', onclick: function () {
      var c = JSON.parse(JSON.stringify(e)), b = e.id, n = 2; while (trouverEcran(b + '-' + n)) n++; c.id = b + '-' + n;
      data.ecrans.splice(i + 1, 0, c); courant = c.id; marquer(); dessinerNav(); dessinerFiche();
    } }));
    actions.appendChild(el('button', { type: 'button', texte: 'Monter', onclick: function () { deplacer(i, -1); } }));
    actions.appendChild(el('button', { type: 'button', texte: 'Descendre', onclick: function () { deplacer(i, 1); } }));
    actions.appendChild(el('button', { classe: 'danger', type: 'button', texte: 'Supprimer cet écran', onclick: function () {
      if (!confirm('Supprimer l\'écran « ' + e.id + ' » ?')) return;
      data.ecrans.splice(i, 1); courant = 'general'; marquer(); dessinerNav(); dessinerFiche();
    } }));
    f.appendChild(actions);
  }
  function deplacer(i, d) { var j = i + d; if (j < 0 || j >= data.ecrans.length) return; var x = data.ecrans[i]; data.ecrans[i] = data.ecrans[j]; data.ecrans[j] = x; marquer(); dessinerNav(); dessinerFiche(); }
  function initType(e) {
    if (e.type === 'placer') { e.presentation = e.presentation || 'frise'; e.zones = e.zones || data.periodes.map(function (p) { return p.id; }); e.cartes = e.cartes || []; }
    if (e.type === 'choix') { e.options = e.options && e.options.length ? e.options : [{ id: 'a', texte: '' }, { id: 'b', texte: '' }]; e.bonne = e.bonne || e.options[0].id; }
    if (e.type === 'multiple') e.options = e.options && e.options.length ? e.options : [{ id: 'a', texte: '', juste: true }, { id: 'b', texte: '', juste: false }, { id: 'c', texte: '', juste: false }];
    if (e.type === 'intro' || e.type === 'synthese') e.paragraphes = e.paragraphes || [''];
    marquer();
  }
  function nouvelEcran() {
    var n = data.ecrans.length + 1, id = 'ecran-' + n; while (trouverEcran(id)) id = 'ecran-' + (++n);
    var e = { id: id, type: 'placer', titre: '', question: '', reponse: { titre: '', paragraphes: [''] } }; initType(e);
    data.ecrans.push(e); courant = id; dessinerNav(); dessinerFiche(); verifierEtMontrer();
  }

  /* ---------- enregistrement ---------- */
  function nettoyer() {
    var c = JSON.parse(JSON.stringify(data));
    c.ecrans.forEach(function (e) {
      if (e.reponse) {
        e.reponse.paragraphes = (e.reponse.paragraphes || []).filter(function (x) { return x && x.trim(); });
        if (!e.reponse.titre && !e.reponse.paragraphes.length && !e.reponse.a_retenir) delete e.reponse;
      }
      if (e.paragraphes) e.paragraphes = e.paragraphes.filter(function (x) { return x && x.trim(); });
    });
    if (c.conclusion) c.conclusion.points = (c.conclusion.points || []).filter(function (x) { return x && x.trim(); });
    return JSON.stringify(c, null, 2) + '\n';
  }
  async function enregistrer() {
    var pb = verifier();
    if (pb.length && !confirm(pb.length + ' problème(s) détecté(s) (liste en haut). Enregistrer quand même ?')) return;
    var texte = nettoyer();
    if (window.showSaveFilePicker) {
      try {
        if (!handle) handle = await window.showSaveFilePicker({ suggestedName: NOM_JSON, types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }] });
        var w = await handle.createWritable(); await w.write(texte); await w.close();
        modifie = false; $('etat').textContent = 'Enregistré'; $('etat').className = 'ok'; return;
      } catch (e) { if (e && e.name === 'AbortError') return; handle = null; }
    }
    var a = el('a', { href: URL.createObjectURL(new Blob([texte], { type: 'application/json' })), download: NOM_JSON });
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    modifie = false; $('etat').textContent = 'Enregistré'; $('etat').className = 'ok';
    alert('Le fichier « ' + NOM_JSON + ' » a été téléchargé : remplace l\'ancien dans le dossier de l\'activité (même nom, même dossier).');
  }

  /* ---------- démarrage ---------- */
  function demarrerAvec(obj) {
    if (!obj || !Array.isArray(obj.ecrans)) throw new Error('Format inattendu : la clé « ecrans » est absente.');
    memoriser(obj);
    data = obj; data.periodes = Array.isArray(data.periodes) ? data.periodes : [];
    $('manuel').hidden = !LOCAL; $('accueil').hidden = true; $('haut').hidden = false; $('mise').hidden = false;
    $('titre-page').textContent = 'Éditeur — ' + NOM_JSON; document.title = 'Éditeur — ' + NOM_JSON;
    courant = 'general'; dessinerNav(); dessinerFiche(); verifierEtMontrer();
  }
  function afficherManuel(raison) {
    if(!LOCAL){ var erreur=document.createElement('p'); erreur.textContent='Erreur : données non chargées. '+(raison||''); document.body.appendChild(erreur); return; }
    $('accueil-msg').textContent = 'Fichier de données non chargé.';
    $('manuel').hidden = false; $('manuel-nom').textContent = NOM_JSON; $('manuel-raison').textContent = raison || '';
  }
  $('b-enregistrer').addEventListener('click', enregistrer);
  $('manuel-fichier').addEventListener('change', function (ev) {
    var fichier = ev.target.files && ev.target.files[0]; if (!fichier) return;
    var l = new FileReader();
    l.onload = function () { try { demarrerAvec(JSON.parse(l.result)); } catch (e) { $('manuel-raison').textContent = 'Fichier illisible : ' + e.message; } };
    l.readAsText(fichier);
  });
  window.addEventListener('beforeunload', function (e) { if (modifie) { e.preventDefault(); e.returnValue = ''; } });

  if (!RACINE) { $('accueil-msg').textContent = 'Ouvre cette page par son nom de fichier.'; return; }
  lireDonnees(NOM_JSON, { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(demarrerAvec)
    .catch(function (e) { afficherManuel('Raison : ' + e.message); });
})();
</script>
</body>
</html>
