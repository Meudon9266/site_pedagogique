<!DOCTYPE html>
<!-- =================================================
     PAGE D'EXERCICES COMMUNE
     Copier ce fichier dans le dossier des exercices et lui donner un nom, la « racine »
     (ex. Allemand9H.html). Elle présente la liste des exercices Nom.N.Racine.json
     du dossier (ex. Anna.1.Allemand9H.json, Wetter.2.Allemand9H.json ; N = ordre)
     et ouvre celui qu'on choisit : Allemand9H.html?exo=Anna.1.Allemand9H.
     Rien n'est à modifier dans ce fichier.
     ================================================= -->
<html lang="fr"><head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compréhension orale · Allemand 9H</title>

<!-- Feuille de style – noms reconstruits
     1) NomdeRef.format.css  (propre à l'exercice, prioritaire, dossier de la page)
     2) sinon Partage.format.css, cherchée dans les dossiers communs (DOSSIERS_PARTAGE)
     La page reste invisible jusqu'à l'arrivée du style (1,5 s au plus). -->
<script>
/* Dossiers où chercher les fichiers communs Partage.*, dans l'ordre :
   - "PartageLectureAudio/"    : sous-dossier du dossier des exercices
   - "../PartageLectureAudio/" : dossier voisin du dossier des exercices
   - ""                        : à côté de la page (ancienne organisation)
   Le premier dossier qui répond est retenu pour la suite (window.DOSSIER_PARTAGE). */
window.DOSSIERS_PARTAGE = window.DOSSIERS_PARTAGE || ["PartageLectureAudio/", "../PartageLectureAudio/", ""];

/* Exercice choisi : Racine.html?exo=Nom.N.Racine
   Tout ce qui appartient à l'exercice porte ce nom : Nom.N.Racine.json, .mp3, .1.png, score, réglages…
   Sans ?exo= : la page présente la liste des exercices Nom.N.Racine.json (Partage.Choix.js). */
(function () {
  var page = decodeURIComponent(location.pathname.split("/").pop() || "").split(".")[0] || "index";
  var exo = "";
  try { exo = new URLSearchParams(location.search).get("exo") || ""; } catch (e) { exo = ""; }
  exo = exo.replace(/\.json$/i, "");
  if (!/^[^\/\\:]+$/.test(exo)) exo = "";
  window.RACINE_PAGE = page;
  window.EXO = exo;
  window.RACINE_EXERCICE = exo || page;
  window.CHOIX_EXERCICES = !exo;
})();
(function () {
  var fichier = decodeURIComponent(location.pathname.split("/").pop() || "");
  var racine  = fichier.split(".")[0];
  var tete    = document.head || document.getElementsByTagName("head")[0];

  var cache = document.createElement("style");
  cache.setAttribute("data-injecte-par", "chargeur");
  cache.textContent = "html{visibility:hidden}";
  tete.appendChild(cache);

  var fini = false;
  function montrer() {
    if (fini) return;
    fini = true;
    if (cache.parentNode) cache.parentNode.removeChild(cache);
  }
  setTimeout(montrer, 1500);

  var essais = [{ nom: racine + ".format.css", dossier: null }];
  window.DOSSIERS_PARTAGE.forEach(function (d) { essais.push({ nom: d + "Partage.format.css", dossier: d }); });

  function essayer(liste) {
    if (!liste.length) {
      console.error("Feuille de style introuvable (" + racine + ".format.css / Partage.format.css dans " + window.DOSSIERS_PARTAGE.join(", ") + ")");
      return montrer();
    }
    var e    = liste[0];
    var lien = document.createElement("link");
    lien.rel  = "stylesheet";
    lien.href = encodeURI(e.nom);
    lien.setAttribute("data-module-racine", "format");
    lien.onload  = function () {
      if (e.dossier !== null && window.DOSSIER_PARTAGE === undefined) window.DOSSIER_PARTAGE = e.dossier;
      console.log("[Chargeur] style : " + e.nom); montrer();
    };
    lien.onerror = function () { lien.parentNode.removeChild(lien); essayer(liste.slice(1)); };
    tete.appendChild(lien);
  }
  essayer(essais);
})();
</script>
</head>

<body>

<!-- ================= HEADER ================= -->
<header id="zone-header">
  <h1 id="page-title">Compréhension orale · Allemand 9H</h1>
  <!-- ===== Prononciation : fonction indépendante de l'écoute et des quiz ===== -->
  <div id="zone-micro" class="micro-groupe" role="group" aria-label="Ma prononciation">
    <span class="micro-titre">Ma prononciation</span>

      <span class="micro-icone" aria-hidden="true">🎤</span><span class="micro-lib">Répéter</span>
    </button>
    <button id="btn-ecoute-eleve" class="micro-btn micro-play" type="button" disabled
            title="Je réécoute mon enregistrement">
      <span class="micro-icone" aria-hidden="true">▶</span><span class="micro-lib">M’écouter</span>
    </button>
    <span id="voyant-rec" class="voyant-rec hidden" aria-live="polite">● REC</span>
  </div>
</header>

<script id="page-config" type="application/json">
{
  "title": "Compréhension orale · Allemand 9H"
}
</script>

<!-- ================= BARRE QUIZ ================= -->

<aside id="zone-quiz-sidebar">


   <div class="audio-controls">

  <button id="btn-ecouter">▶️ Écouter</button>
  <button id="btn-reecouter">🔁 Réécouter</button>
  </div>

  <!-- libellés par défaut : remplacés par "bouton" de chaque quiz dans NomdeRef.json -->
  <nav class="quiz-nav">
    <button class="quiz-nav-btn quizcomp" data-type="quizcomp" aria-disabled="true">QCM</button>
    <button class="quiz-nav-btn quizvoc" data-type="quizvoc" aria-disabled="false">QCM à l'oral</button>

<!-- Paramètres (repliés par défaut) : quiz affichés, mots traduits, corrigé -->

  <div class="params-titre">Quiz affichés</div>

  </label>

  <!-- lecture : voix du fichier / une seule voix / deux voix pour les dialogues (Partage.DoubleEcoute.js) -->

  <div id="vocab-params" class="params-section"></div>

  <div class="pied-params">

    <button id="btn-corrige" class="btn-corrige" type="button" title="Corrigé pour l'enseignant (PDF)">corrigé</button>
  </div>
</details>

<!-- Page de prise de notes à imprimer (contenu : bloc "fiche" de NomdeRef.json) -->
<button id="btn-fiche" class="btn-fiche" type="button"
        title="Page à imprimer (ou à enregistrer en PDF) pour prendre des notes pendant l'écoute">🖨 Obtenir une page de prise de notes</button>

</aside>


<!-- ================= CONTENU ================= -->
<main id="zone-main">


<section id="zone-contenu">
<!-- Liste des exercices (Partage.Choix.js), ou titre et texte de l'exercice choisi,
     construits depuis son JSON (bloc "texte") par Partage.Texte.js. -->
<p class="texte-attente">Chargement du texte…</p>
</section>


<!-- ================= AUDIO ================= -->

<section id="zone-audio">

  <!-- LOG DEBUG : balise audio déclarée -->
  <!-- Fichier audio : nom reconstruit par DoubleEcoute (NomdeRef.mp3).
       S'il n'existe pas, la synthèse vocale prend le relais. -->
  <audio id="audio-player" preload="auto">
  </audio>


</section>
<!-- ================= ZONES QUIZ ================= -->
<section id="zone-quiz">
  <section id="zone-quizcomp" class="zone-quiz"></section>
  <section id="zone-quizvoc" class="zone-quiz"></section>
  <section id="zone-qmd" class="zone-quiz"></section>
  <section id="zone-qchi" class="zone-quiz"></section>
</section>

</main>

<!-- ================= FOOTER CONTROLS ================= -->
<section id="zone-footer-controls"></section>

<!-- ================= NAVIGATION ================= -->
<nav id="zone-navigation"></nav>

<script>
  function initPage() {
    console.log("=== initPage START ===");

    /* HEADER */
    if (typeof uiHeader !== "undefined") {
      uiHeader.init({
        headerTarget: "zone-header",
        controlsTarget: "zone-footer-controls",
        defaultTitle: ""
      });
      console.log("[initPage] uiHeader OK");
    }

    /* NAVIGATION */
    if (typeof uiNavigation !== "undefined") {
      uiNavigation.init({
        target: "zone-navigation"
      });
      console.log("[initPage] uiNavigation OK");
    }

    /* SCORE */
    if (typeof scoreManager !== "undefined") {
      scoreManager.init();
      console.log("[initPage] scoreManager OK");
    }

    /* AUDIO / TTS */
    if (typeof initDoubleEcoute === "function") {
      initDoubleEcoute({
        audioId: "audio-player",
        btnEcouter: "btn-ecouter",
        btnReecouter: "btn-reecouter",
        phrasesSelector: ".phrase"
      });
      console.log("[initPage] doubleEcoute OK");
    }

      /* MICRO – répétition élève */
      if (typeof initMicroRepetition === "function") {
        initMicroRepetition();
        console.log("[initPage] microRepetition OK");
      }

    console.log("=== initPage END ===");
  }

  // Lancement : par le chargeur des modules (en bas de page),
  // une fois tous les fichiers NomdeRef.(fonction).js chargés.
</script>

<!-- =================================================
     MODULES – noms reconstruits, avec repli sur les fichiers communs
     Racine = nom de ce fichier HTML avant le premier point.
     Pour chaque module de la liste, dans l'ordre :
       1) NomdeRef.(module).js   propre à l'exercice, prioritaire (dossier de la page)
       2) sinon Partage.(module).js   commun, dans le dossier PartageLectureAudio
          (liste DOSSIERS_PARTAGE, définie en haut de la page)
     Quand un fichier manque, la console affiche une erreur
     « introuvable » pour lui : c'est normal, le suivant prend le relais.
     Les questions restent propres à l'exercice : NomdeRef.json, dans le dossier de la page.
     ================================================= -->
<script>
(function () {
  var fichier = decodeURIComponent(location.pathname.split("/").pop() || "");
  var racine  = fichier.split(".")[0];
  var COMMUN  = "Partage";
  var modules = [
    "AudioDe",          // voix allemandes + dialogue surligné
    "DoubleEcoute",     // Écouter / Réécouter / Révéler + barre de lecture
    "MicroRepetition",  // enregistrement de l'élève
    "ScoreManager",     // score global
    "UiHeader",         // titre + TéléRap
    "UiNavigation",     // Accueil / Suivant / score
    "Choix",            // liste des exercices Nom.N.Racine.json, reprise de l'exercice précédent
    "Texte",            // texte de l'exercice (bloc "texte" du JSON)
    "Quiz",             // les 4 quiz (+ NomdeRef.json)
    "Vocabulaire",      // mots difficiles traduits au survol (bloc "vocabulaire" du JSON)
    "Fiche"             // fiche de notes à imprimer (bloc "fiche" du JSON)
  ];

  window.ModulesCharges = [];   // pour vérifier dans la console d'où vient chaque module

  // dossiers communs : celui déjà trouvé (feuille de style ou module précédent) d'abord
  function dossiers() {
    var liste = (window.DOSSIERS_PARTAGE || ["PartageLectureAudio/", "../PartageLectureAudio/", ""]).slice();
    var trouve = window.DOSSIER_PARTAGE;
    if (trouve !== undefined) {
      liste = liste.filter(function (d) { return d !== trouve; });
      liste.unshift(trouve);
    }
    return liste;
  }

  function chargerScript(src, ok, echec) {
    var s = document.createElement("script");
    s.src = encodeURI(src);
    s.setAttribute("data-module-racine", src);
    s.onload  = ok;
    s.onerror = function () { s.parentNode.removeChild(s); echec(); };
    document.body.appendChild(s);
  }

  // essaie les fichiers l'un après l'autre
  function essayer(liste, ok, echec) {
    if (!liste.length) return echec();
    chargerScript(liste[0].src, function () { ok(liste[0]); }, function () { essayer(liste.slice(1), ok, echec); });
  }

  // un module après l'autre : l'ordre de la liste est respecté
  function suivant(i) {
    if (i >= modules.length) {
      if (typeof window.initPage === "function") window.initPage();
      return;
    }
    var nom = modules[i];
    var liste = [{ src: racine + "." + nom + ".js", dossier: null }];
    dossiers().forEach(function (d) { liste.push({ src: d + COMMUN + "." + nom + ".js", dossier: d }); });

    essayer(liste, function (e) {
      if (e.dossier !== null) window.DOSSIER_PARTAGE = e.dossier;
      window.ModulesCharges.push(e.src);
      suivant(i + 1);
    }, function () {
      console.error("Module introuvable : " + liste.map(function (e) { return e.src; }).join(" / "));
      suivant(i + 1);
    });
  }

  suivant(0);
})();
</script>

</body></html>
