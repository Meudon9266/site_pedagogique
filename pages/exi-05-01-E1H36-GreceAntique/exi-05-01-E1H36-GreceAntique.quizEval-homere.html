<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="audio" content="../PartageLectureAudio/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Révision</title>
<style>
  :root{
    --fond:#f6f1e7; --carte:#fffdf8; --encre:#2b2a33; --doux:#6b6757;
    --bleu:#1f4e79; --bleu-clair:#dce8f3; --or:#b8892b;
    --ok:#2e7d4f; --ok-fond:#e1f3e8; --ko:#b23a3a; --ko-fond:#f8e1e1;
    --bord:#d9cfba;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--fond);color:var(--encre);
    font:17px/1.5 Georgia,"Times New Roman",serif;padding:16px}
  .page{max-width:820px;margin:0 auto}
  header{text-align:center;padding:18px 10px 8px}
  header h1{margin:0;font-size:1.9rem;color:var(--bleu);letter-spacing:.5px}
  header p{margin:6px 0 0;color:var(--doux);font-style:italic}
  .barre{position:sticky;top:0;z-index:5;background:var(--fond);padding:8px 0 10px}
  .jauge{height:10px;background:#e6dcc4;border-radius:6px;overflow:hidden}
  .jauge>div{height:100%;width:0;background:linear-gradient(90deg,var(--or),var(--bleu));transition:width .4s}
  .score-live{display:flex;justify-content:space-between;font:14px system-ui,sans-serif;color:var(--doux);margin-top:4px}
  section{background:var(--carte);border:1px solid var(--bord);border-radius:14px;
    padding:18px 20px;margin:18px 0;box-shadow:0 2px 6px rgba(0,0,0,.04)}
  section h2{margin:0 0 4px;font-size:1.25rem;color:var(--bleu)}
  section .consigne{margin:0 0 14px;color:var(--doux);font-size:.95rem;font-style:italic}
  .question{margin:16px 0 6px;padding-top:12px;border-top:1px dashed var(--bord)}
  .question:first-of-type{border-top:none;padding-top:0}
  .question p{margin:0 0 8px;font-weight:bold}
  .options{display:grid;gap:8px}
  .opt{font:inherit;text-align:left;background:#fff;border:2px solid var(--bord);
    border-radius:10px;padding:9px 12px;cursor:pointer;color:inherit;transition:.15s}
  .opt:hover:not(:disabled){border-color:var(--bleu);background:var(--bleu-clair)}
  .opt:disabled{cursor:default}
  .opt.ok{border-color:var(--ok);background:var(--ok-fond)}
  .opt.ko{border-color:var(--ko);background:var(--ko-fond)}
  .explic{display:none;margin-top:8px;padding:8px 12px;border-left:4px solid var(--or);
    background:#fbf5e3;border-radius:6px;font-size:.95rem}
  .explic.visible{display:block}
  .ligne{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;
    padding:8px 0;border-top:1px dashed var(--bord)}
  .ligne:first-of-type{border-top:none}
  .ligne .gauche{font-weight:bold}
  .ligne select{font:inherit;font-size:.95rem;padding:8px;border:2px solid var(--bord);
    border-radius:8px;background:#fff;width:100%}
  .ligne.ok select{border-color:var(--ok);background:var(--ok-fond)}
  .ligne.ko select{border-color:var(--ko);background:var(--ko-fond)}
  .ligne .correction{grid-column:1/-1;font-size:.9rem;color:var(--ko);display:none}
  .ligne.ko .correction{display:block}
  .btn{font:600 15px system-ui,sans-serif;background:var(--bleu);color:#fff;border:none;
    border-radius:10px;padding:10px 18px;cursor:pointer;margin-top:12px}
  .btn:hover{filter:brightness(1.12)}
  .btn:disabled{background:#9aa7b3;cursor:default}
  .resultat-section{margin-top:10px;font:600 15px system-ui,sans-serif;color:var(--bleu)}
  #final{display:none;text-align:center}
  #final.visible{display:block}
  #final .gros{font-size:2.6rem;color:var(--bleu);margin:4px 0}
  #final ul{text-align:left;max-width:520px;margin:12px auto;padding-left:20px;color:var(--doux)}
  #chargement{display:none;text-align:center;border:2px dashed var(--or);background:#fbf5e3}
  #chargement.visible{display:block}
  @media(max-width:560px){.ligne{grid-template-columns:1fr}}
</style>
<meta name="robots" content="noindex, nofollow">
<style>[hidden]{display:none!important}</style>
</head>
<body>
<div class="page">
  <header>
    <h1 id="titre"></h1>
    <p id="sous-titre"></p>
  </header>

  

  <div class="barre">
    <div class="jauge"><div id="jauge"></div></div>
    <div class="score-live"><span id="progression">0 / 0 réponses</span><span id="score-live">Score : 0</span></div>
  </div>

  <main id="contenu"></main>

  <section id="final">
    <h2>Bilan</h2>
    <div class="gros" id="final-score"></div>
    <p id="final-message"></p>
    <ul id="final-detail"></ul>
    <button class="btn" id="btn-recommencer">↺ Recommencer</button>
  </section>
</div>

<section id="chargement" hidden>
    <p>Le fichier de contenu n'a pas pu être chargé automatiquement (usage local). Chargez-le manuellement :</p>
    <input type="file" id="chargement-fichier" accept=".json,application/json">
  </section>
<script>
/* Le script associé est reconstruit à partir du nom de ce fichier : racine.html → racine.js */
(function(){
  var nom = decodeURIComponent(location.pathname.split('/').pop() || '');
  var racine = (function(n){var s=n.split('.');return s.length>2&&!/^(editeur|voc|menu|listeQuiz|html|js|json|css|\\d+)$/.test(s[1])?s[0]+'.'+s[1]:s[0];})(nom);
  var s = document.createElement('script');
  s.src = racine + '.js';
  document.body.appendChild(s);
})();
</script>
</body>
</html>
