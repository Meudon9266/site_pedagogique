<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Éditeur — liste des exercices du thème</title>
<style>
:root{--fond:#f6f7f9;--carte:#fff;--texte:#1d2430;--doux:#5a6577;--bord:#d3d9e2;--accent:#2d6aa8;--ok:#2f7a4f;--ko:#b3382c}
@media (prefers-color-scheme:dark){:root{--fond:#14181f;--carte:#1d232d;--texte:#e6eaf0;--doux:#9aa6b8;--bord:#364052;--accent:#7fb0e6;--ok:#7ccf9c;--ko:#f08a7e}}
*{box-sizing:border-box}
body{margin:0;background:var(--fond);color:var(--texte);font:16px/1.5 system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--carte);border-bottom:1px solid var(--bord);padding:.6rem 1rem;display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
header h1{font-size:1.05rem;margin:0;flex:1 1 16rem}
main{max-width:56rem;margin:0 auto;padding:1rem 1rem 4rem}
section.bloc,.exo{background:var(--carte);border:1px solid var(--bord);border-radius:10px;padding:.8rem 1rem;margin:1rem 0}
h2{font-size:1.05rem;margin:.2rem 0 .6rem}
label{display:block;font-size:.85rem;color:var(--doux);margin:.5rem 0 .15rem}
input[type=text],textarea,select{width:100%;font:inherit;color:inherit;background:var(--fond);border:1px solid var(--bord);border-radius:6px;padding:.4rem .5rem}
textarea{min-height:4.5rem;resize:vertical}
.ligne{display:grid;gap:.6rem}
@media(min-width:640px){.ligne{grid-template-columns:1fr 1fr}}
button{font:inherit;border:1px solid var(--accent);background:var(--carte);color:var(--accent);border-radius:8px;padding:.35rem .8rem;cursor:pointer}
button.plein{background:var(--accent);color:var(--carte)}
button.danger{border-color:var(--ko);color:var(--ko)}
.outils{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.6rem}
.lien{font-size:.85rem;color:var(--doux);word-break:break-all}
#etat{font-size:.9rem;color:var(--doux)}
#etat.modif{color:var(--ko);font-weight:600}
#manuel{margin:1rem 0;padding:.7rem 1rem;border:1px dashed var(--doux);border-radius:8px;color:var(--doux)}
#manuel[hidden]{display:none}
.aide{color:var(--doux);font-size:.9rem}
</style>
</head>
<body>
<header>
  <h1 id="titre">Éditeur — liste des exercices</h1>
  <span id="etat">Chargement…</span>
  <button id="enregistrer" class="plein" type="button">Enregistrer le JSON</button>
</header>
<main>
  <div id="manuel" hidden>
    <p>Le fichier <strong id="manuel-nom"></strong> n'a pas pu être chargé automatiquement (ouverture locale, par exemple). Choisis-le toi-même :</p>
    <input type="file" id="manuel-fichier" accept=".json,application/json">
  </div>
  <div id="contenu"></div>
</main>
<script>
(function () {
  'use strict';
  /* Règle de reconstruction : racine.X.editeur.html édite racine.X.json (ici THEME.listeQuiz.editeur.html → THEME.listeQuiz.json). */
  var nomPage = decodeURIComponent(location.pathname.split('/').pop() || '');
  var NOM_JSON = nomPage.replace(/\.editeur\.html$/, '') + '.json';
  var D = null, modifie = false, fichierHandle = null;
  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) { if (k === 'text') e.textContent = attrs[k]; else if (k === 'class') e.className = attrs[k]; else e.setAttribute(k, attrs[k]); }
    (kids || []).forEach(function (c) { e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  var etat = document.getElementById('etat');
  function marquer(m) { modifie = m; etat.textContent = m ? 'Modifications non enregistrées' : 'Aucune modification'; etat.className = m ? 'modif' : ''; }
  function champ(libelle, obj, cle, opts) {
    opts = opts || {};
    var c = opts.zone ? el('textarea') : el('input', { type: 'text' });
    c.value = obj[cle] === undefined ? '' : obj[cle];
    c.addEventListener('input', function () { obj[cle] = c.value; marquer(true); if (opts.apres) opts.apres(); });
    return el('div', null, [el('label', { text: libelle }), c]);
  }
  function dessiner() {
    var racine = document.getElementById('contenu'); racine.textContent = '';
    D.section = D.section || {}; D.types = D.types || {}; D.exercices = D.exercices || [];
    var s = D.section;
    racine.appendChild(el('section', { class: 'bloc' }, [el('h2', { text: 'Section de la conclusion' }),
      champ('Titre de la section', s, 'titre'), champ('Texte d\'introduction', s, 'intro', { zone: true }),
      el('div', { class: 'ligne' }, [champ('Texte du bouton des cartes', s, 'bouton'), champ('Titre du bloc dans le plan du cours', s, 'plan')])]));
    var types = el('section', { class: 'bloc' }, [el('h2', { text: 'Types de quiz (libellés)' }), el('p', { class: 'aide', text: 'Les clés « decouverte » et « evaluation » ne se modifient pas : ce sont elles que choisit chaque exercice.' })]);
    Object.keys(D.types).forEach(function (k) {
      var t = D.types[k];
      types.appendChild(el('h2', { text: k }));
      types.appendChild(el('div', { class: 'ligne' }, [champ('Nom du quiz (étiquette)', t, 'quiz'), champ('Précision (après le nom)', t, 'note'),
        champ('Titre du groupe de cartes', t, 'titre'), champ('Icône', t, 'icone'), champ('Étiquette dans le plan', t, 'planEtiquette')]));
    });
    racine.appendChild(types);
    racine.appendChild(el('h2', { text: 'Exercices (dans l\'ordre d\'affichage)' }));
    D.exercices.forEach(function (x, i) {
      var lien = el('p', { class: 'lien' });
      function majLien() { lien.textContent = 'Fichier ouvert : ' + THEME() + '.' + (x.suffixe || '…') + '.html'; }
      var sel = el('select');
      Object.keys(D.types).forEach(function (k) { var o = el('option', { value: k, text: D.types[k].quiz || k }); if (x.type === k) o.selected = true; sel.appendChild(o); });
      sel.addEventListener('change', function () { x.type = sel.value; marquer(true); });
      var bloc = el('div', { class: 'exo' }, [
        el('div', { class: 'ligne' }, [el('div', null, [el('label', { text: 'Type' }), sel]), champ('Suffixe du quiz (ce qui suit la racine du thème, ex. quizDecouv-periodes)', x, 'suffixe', { apres: majLien })]),
        lien, champ('Titre affiché', x, 'titre'), champ('Contenu (ce qu\'on y trouve)', x, 'contenu', { zone: true })]);
      majLien();
      var outils = el('div', { class: 'outils' });
      var haut = el('button', { type: 'button', text: '↑ Monter' }), bas = el('button', { type: 'button', text: '↓ Descendre' }), sup = el('button', { type: 'button', class: 'danger', text: '✕ Supprimer' });
      haut.disabled = i === 0; bas.disabled = i === D.exercices.length - 1;
      haut.addEventListener('click', function () { D.exercices.splice(i - 1, 0, D.exercices.splice(i, 1)[0]); marquer(true); dessiner(); });
      bas.addEventListener('click', function () { D.exercices.splice(i + 1, 0, D.exercices.splice(i, 1)[0]); marquer(true); dessiner(); });
      sup.addEventListener('click', function () { if (confirm('Supprimer « ' + (x.titre || x.suffixe || 'cet exercice') + ' » de la liste ?')) { D.exercices.splice(i, 1); marquer(true); dessiner(); } });
      [haut, bas, sup].forEach(function (b) { outils.appendChild(b); });
      bloc.appendChild(outils); racine.appendChild(bloc);
    });
    var ajout = el('button', { type: 'button', class: 'plein', text: '+ Ajouter un exercice' });
    ajout.addEventListener('click', function () { D.exercices.push({ suffixe: '', type: Object.keys(D.types)[0] || 'decouverte', titre: '', contenu: '' }); marquer(true); dessiner(); window.scrollTo(0, document.body.scrollHeight); });
    racine.appendChild(ajout);
  }
  function THEME() { return nomPage.split('.')[0]; }
  function charger(d) { D = d; dessiner(); marquer(false); document.getElementById('manuel').hidden = true; }
  function enregistrer() {
    var texte = JSON.stringify(D, null, 1);
    function telecharger() {
      var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([texte], { type: 'application/json' })); a.download = NOM_JSON;
      document.body.appendChild(a); a.click(); a.remove(); marquer(false);
    }
    if (window.showSaveFilePicker) {
      (fichierHandle ? Promise.resolve(fichierHandle) : window.showSaveFilePicker({ suggestedName: NOM_JSON, types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }] }))
        .then(function (h) { fichierHandle = h; return h.createWritable(); })
        .then(function (w) { return w.write(texte).then(function () { return w.close(); }); })
        .then(function () { marquer(false); })
        .catch(function (e) { if (e && e.name !== 'AbortError') telecharger(); });
    } else telecharger();
  }
  document.getElementById('enregistrer').addEventListener('click', enregistrer);
  window.addEventListener('beforeunload', function (e) { if (modifie) { e.preventDefault(); e.returnValue = ''; } });
  document.getElementById('manuel-fichier').addEventListener('change', function (e) {
    var f = e.target.files[0]; if (!f) return; var r = new FileReader();
    r.onload = function () { try { charger(JSON.parse(r.result)); } catch (x) { alert('Fichier illisible.'); } }; r.readAsText(f);
  });
  document.getElementById('titre').textContent = 'Éditeur — ' + NOM_JSON;
  fetch(NOM_JSON, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(charger)
    .catch(function () { document.getElementById('manuel-nom').textContent = NOM_JSON; document.getElementById('manuel').hidden = false; etat.textContent = 'Fichier non chargé'; });
})();
</script>
</body>
</html>
