<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qu'est-ce qu'une hypothèse ? : à ton avis ?</title>
<style>
  :root {
    --fond: #fbf9f4; --texte: #26231f; --doux: #6b655b; --carte: #ffffff;
    --bord: #d9d2c3; --accent: #9a4a2b; --accent-texte: #ffffff; --accent-fond: #f4e4db;
    --ok: #2f7a4f; --ok-fond: #e5f3ea; --ko: #b3382c; --ko-fond: #fbe9e6; --moyen: #8a6a12; --moyen-fond: #fbf1d6;
    --zl: 90%; --zs: 60%;           /* clarté / saturation du fond des zones */
    --zt: #26231f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fond: #1c1a17; --texte: #ece7dc; --doux: #a59d8d; --carte: #26231f;
      --bord: #3f3a32; --accent: #d98458; --accent-texte: #1c1a17; --accent-fond: #3a2a21;
      --ok: #7ccf9c; --ok-fond: #1e3327; --ko: #f08a7e; --ko-fond: #3a2220; --moyen: #e5c36a; --moyen-fond: #372f17;
      --zl: 24%; --zs: 35%; --zt: #ece7dc;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fond); color: var(--texte); font: 17px/1.5 Georgia, 'Times New Roman', serif; }
  main, #manuel { max-width: 940px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.6rem; margin: 0 0 12px; }
  h2 { font-size: 1.2rem; margin: 20px 0 8px; }
  .consigne, .doux, .legende { color: var(--doux); }
  .legende { font-size: .9rem; margin: 4px 0 10px; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--bord); background: var(--carte); color: var(--texte); border-radius: 8px; padding: 10px 14px; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { cursor: default; opacity: .6; }
  button.primaire { background: var(--accent); color: var(--accent-texte); border-color: var(--accent); }
  .progres { color: var(--doux); font-size: .9rem; margin-bottom: 12px; }
  .barre { display: block; height: 4px; background: var(--bord); border-radius: 2px; margin-top: 6px; }
  .barre i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
  .question { font-size: 1.15rem; font-weight: bold; margin: 8px 0 12px; }
  .essai-reprise { color: var(--moyen); font-weight: bold; margin: 6px 0; }
  .pied { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; }

  /* --- bandeau des périodes --- */
  .periodes { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; margin: 16px 0; }
  .periode { --h: 0; border: 1px solid hsl(var(--h) 45% 55%); border-top: 6px solid hsl(var(--h) 55% 50%); border-radius: 8px; background: hsl(var(--h) var(--zs) var(--zl)); padding: 8px 10px; color: var(--zt); }
  .periode .num, .zone-tete .num, th .num { display: block; font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; opacity: .75; }
  .periode strong, .zone-tete strong, th strong { display: block; line-height: 1.2; }
  .periode .dates, .zone-tete .dates, th .dates { display: block; font-size: .85rem; opacity: .8; }
  .periode-resume { font-size: .85rem; margin: 6px 0 0; }

  /* --- placer --- */
  .pool { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; margin: 8px 0 14px; min-height: 56px; border: 2px dashed var(--bord); border-radius: 10px; }
  .pool.survol { border-color: var(--accent); }
  .carte { background: var(--carte); color: var(--texte); border: 1px solid var(--bord); border-left: 5px solid var(--accent); border-radius: 8px; padding: 8px 10px; font-size: .92rem; line-height: 1.35; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; flex: 1 1 200px; max-width: 100%; }
  .carte.choisie { outline: 3px solid var(--accent); }
  .carte.leve { opacity: .35; }
  .carte:focus-visible { outline: 3px solid var(--accent); }
  .carte.juste { border-color: var(--ok); border-left-color: var(--ok); background: var(--ok-fond); cursor: default; }
  .carte.faux { border-color: var(--ko); border-left-color: var(--ko); background: var(--ko-fond); cursor: default; }
  .fantome { position: fixed; z-index: 50; pointer-events: none; opacity: .95; box-shadow: 0 8px 20px rgba(0,0,0,.3); }
  .zones { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .zone { --h: 30; border: 1px solid hsl(var(--h) 45% 55%); border-radius: 10px; background: hsl(var(--h) var(--zs) var(--zl)); color: var(--zt); display: flex; flex-direction: column; min-height: 140px; }
  .zone.survol { outline: 3px solid var(--accent); }
  .zone-tete { padding: 8px 10px; border-bottom: 1px solid hsl(var(--h) 45% 55% / .5); }
  .zone-corps { padding: 8px; display: flex; flex-direction: column; gap: 6px; flex: 1 1 auto; }
  .zone-corps .carte { flex: 0 0 auto; }
  .vide { color: var(--doux); font-size: .85rem; font-style: italic; }
  .zone.inerte { opacity: .55; border-style: dashed; background: transparent; }
  .zone:focus-visible { outline: 3px solid var(--accent); }
  /* frise : bloc par période, axe du temps */
  .axe { text-align: right; font-size: .85rem; color: var(--doux); border-bottom: 3px solid var(--doux); position: relative; margin-bottom: 10px; padding-bottom: 2px; }
  .axe::after { content: ''; position: absolute; right: 0; bottom: -8px; border: 6px solid transparent; border-left: 10px solid var(--doux); }
  .frise .zone { border-top-width: 6px; border-top-color: hsl(var(--h) 55% 50%); }
  /* fil : ruban qui traverse toutes les zones, avec un point de raccord par zone */
  .ruban { border-radius: 999px; background: var(--accent); color: #fff; padding: 6px 18px; font-weight: bold; font-size: .95rem; box-shadow: 0 2px 6px rgba(0,0,0,.2); position: relative; text-shadow: 0 1px 2px rgba(0,0,0,.45); }
  .fil .zones { margin-top: 18px; }
  .fil .zone { position: relative; border-radius: 4px 4px 10px 10px; }
  .fil .zone::before { content: ''; position: absolute; top: -18px; left: 50%; width: 3px; height: 18px; background: var(--doux); transform: translateX(-50%); }
  .fil .zone::after { content: ''; position: absolute; top: -24px; left: 50%; width: 14px; height: 14px; border-radius: 50%; background: hsl(var(--h) 60% 50%); border: 2px solid var(--fond); transform: translateX(-50%); }
  .fil .zone.inerte::before, .fil .zone.inerte::after { opacity: .35; }
  /* tri : deux boîtes */
  .tri .zones { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .tri .zone:nth-child(1) { --h: 90; } .tri .zone:nth-child(2) { --h: 300; }
  .correction { list-style: none; padding: 0; margin: 0 0 12px; }
  .correction li { border: 1px solid var(--bord); border-left-width: 5px; border-radius: 8px; padding: 8px 12px; margin: 8px 0; background: var(--carte); }
  .correction li.juste { border-left-color: var(--ok); }
  .correction li.faux { border-left-color: var(--ko); }
  .correction .corr { color: var(--ko); font-weight: bold; }
  .correction .expl { display: block; margin-top: 4px; }

  /* --- choix, multiple --- */
  .choix { display: grid; gap: 8px; margin: 12px 0; }
  .choix button, label.opt { text-align: left; }
  label.opt { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--bord); background: var(--carte); border-radius: 8px; padding: 10px 14px; cursor: pointer; }
  label.opt.fige { cursor: default; }
  .choix .juste { border-color: var(--ok); background: var(--ok-fond); }
  .choix .faux { border-color: var(--ko); background: var(--ko-fond); }
  .choix .choisi { outline: 2px solid var(--accent); }
  .note { display: block; font-size: .9rem; color: var(--doux); margin-top: 2px; }

  /* --- réponse, verdict --- */
  .verdict { margin-top: 16px; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--bord); background: var(--carte); font-weight: bold; }
  .verdict.ok { border-color: var(--ok); background: var(--ok-fond); }
  .verdict.moyen { border-color: var(--moyen); background: var(--moyen-fond); }
  .verdict.ko { border-color: var(--ko); background: var(--ko-fond); }
  .reponse { margin-top: 16px; padding: 4px 18px 14px; border-radius: 10px; border: 1px solid var(--bord); background: var(--carte); }
  .reponse h2 { margin-top: 14px; }
  .retenir { margin-top: 12px; padding: 10px 14px; border-left: 4px solid var(--accent); background: var(--accent-fond); border-radius: 0 8px 8px 0; font-weight: bold; }
  ul.points li { margin: 8px 0; }
  img.illus { max-width: 100%; border-radius: 8px; }

  /* --- synthèse --- */
  .defile { overflow-x: auto; margin: 8px 0 16px; }
  table.synthese { border-collapse: separate; border-spacing: 4px; width: 100%; min-width: 720px; font-size: .85rem; }
  table.synthese th { --h: 0; background: hsl(var(--h) var(--zs) var(--zl)); border-top: 5px solid hsl(var(--h) 55% 50%); color: var(--zt); text-align: left; vertical-align: top; padding: 6px 8px; font-weight: normal; }
  table.synthese th.fil-nom { background: var(--accent); color: var(--accent-texte); border-top: 0; font-weight: bold; min-width: 90px; }
  table.synthese th.coin { background: transparent; border: 0; }
  table.synthese td { vertical-align: top; background: var(--carte); border: 1px solid var(--bord); border-radius: 6px; padding: 6px 8px; }
  table.synthese td p { margin: 0 0 6px; } table.synthese td ul { margin: 0; padding-left: 1.1em; } table.synthese td li { margin-bottom: 4px; }
  #manuel { border-top: 1px solid var(--bord); color: var(--doux); font-size: .95rem; }
  #manuel[hidden] { display: none; }
</style>
<meta name="robots" content="noindex, nofollow">
<style>[hidden]{display:none!important}</style>
</head>
<body>
<main id="app" aria-live="polite"></main>



<div id="manuel" hidden>
  <p>Le fichier de données <strong id="manuel-nom"></strong> n'a pas pu être chargé automatiquement (ouverture locale de la page, par exemple). Choisis-le toi-même :</p>
  <p><input type="file" id="manuel-fichier" accept=".json,application/json"></p>
  <p id="manuel-raison"></p>
</div>
<script>
  /* Le nom de ce fichier donne la racine ; le script, le JSON et les images portent le même nom. */
  (function () {
    var nom = decodeURIComponent(location.pathname.split('/').pop() || '');
    window.RACINE = (function(n){var s=n.split('.');return s.length>2&&!/^(editeur|voc|menu|listeQuiz|html|js|json|css|\\d+)$/.test(s[1])?s[0]+'.'+s[1]:s[0];})(nom);
    var s = document.createElement('script');
    s.src = (window.RACINE || '') + '.js';
    s.onerror = function () {
      document.getElementById('app').textContent = 'Le script « ' + window.RACINE + '.js » est introuvable : il doit porter le même nom que cette page.';
    };
    if (window.RACINE) document.body.appendChild(s);
    else document.getElementById('app').textContent = 'Ouvre cette page par son nom de fichier.';
  })();
</script>
</body>
</html>
