<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Éditeur</title>
<style>
  :root{--fond:#f1f3f6;--carte:#fff;--encre:#222;--doux:#667;--bleu:#1f4e79;--bord:#cfd6de;--ok:#2e7d4f;--or:#b8892b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--fond);color:var(--encre);font:15px/1.45 system-ui,sans-serif;padding:16px}
  .page{max-width:900px;margin:0 auto}
  h1{margin:0 0 4px;font-size:1.4rem;color:var(--bleu)}
  .sous{color:var(--doux);margin:0 0 14px}
  .barre{position:sticky;top:0;z-index:5;background:var(--fond);padding:10px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .btn{font:600 14px system-ui,sans-serif;background:var(--bleu);color:#fff;border:none;border-radius:8px;padding:9px 16px;cursor:pointer;text-decoration:none;display:inline-block}
  .btn.second{background:#fff;color:var(--bleu);border:2px solid var(--bleu)}
  .btn:hover{filter:brightness(1.1)}
  #etat{color:var(--doux);font-size:.9rem}
  #etat.modifie{color:var(--or);font-weight:600}
  .carte{background:var(--carte);border:1px solid var(--bord);border-radius:12px;padding:14px 16px;margin:14px 0}
  .carte h2{margin:0 0 10px;font-size:1.05rem;color:var(--bleu)}
  label{display:block;font-size:.8rem;font-weight:600;color:var(--doux);margin:8px 0 2px;text-transform:uppercase;letter-spacing:.3px}
  input[type=text],textarea{width:100%;font:inherit;padding:7px 9px;border:1.5px solid var(--bord);border-radius:7px;background:#fff}
  input[type=text]:focus,textarea:focus{outline:none;border-color:var(--bleu)}
  textarea{resize:vertical;min-height:54px}
  .bloc{border-top:1px dashed var(--bord);margin-top:12px;padding-top:6px}
  .bloc-titre{font-weight:700;font-size:.85rem;color:var(--doux)}
  .opt{display:flex;gap:8px;align-items:center;margin-top:6px}
  .opt input[type=radio]{flex:none;accent-color:var(--ok);width:18px;height:18px}
  .opt input[type=text]{flex:1}
  .aide{font-size:.82rem;color:var(--doux);margin:2px 0 0}
  .paire{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  #chargement{display:none;border:2px dashed var(--or);background:#fbf5e3;border-radius:12px;padding:14px;margin:14px 0}
  #chargement.visible{display:block}
  .vide{color:var(--doux);font-style:italic}
  @media(max-width:600px){.paire{grid-template-columns:1fr}}
</style>
<meta name="robots" content="noindex, nofollow">
<style>[hidden]{display:none!important}</style>
</head>
<body>
<div class="page">
  <h1>Éditeur de contenu</h1>
  <p class="sous" id="sous"></p>

  

  <div class="barre">
    <button class="btn" id="btn-telecharger" disabled>⬇ Enregistrer le JSON</button>
    <a class="btn second" id="lien-exercice" href="#" target="_blank" rel="noopener">▶ Ouvrir l'exercice</a>
    <span id="etat">Aucune modification</span>
  </div>

  <div id="formulaire"></div>
</div>

<div id="chargement" hidden>
    <p>Le fichier de contenu n'a pas pu être chargé automatiquement (usage local). Chargez-le manuellement :</p>
    <input type="file" id="chargement-fichier" accept=".json,application/json">
  </div>
<script>
(function(){
  var LOCAL = typeof location !== 'undefined' && location.protocol === 'file:';
  var CACHE = 'donnees-v1:' + (typeof location !== 'undefined' ? decodeURIComponent(location.pathname.split('/').pop()) : 'test');
  function memoriser(obj) { if (LOCAL) { try { localStorage.setItem(CACHE, JSON.stringify(obj)); } catch(e) {} } }
  function lireDonnees(url, options) {
    if (LOCAL) { try { var c = localStorage.getItem(CACHE); if(c) return Promise.resolve({ok:true,json:function(){return Promise.resolve(JSON.parse(c));}}); } catch(e) {} }
    return fetch(url, options);
  }

  /* La racine vient du nom de ce fichier : racine.editeur.html → racine */
  var nom = decodeURIComponent(location.pathname.split('/').pop() || '');
  var RACINE = (function(n){var s=n.split('.');return s.length>2&&!/^(editeur|voc|menu|listeQuiz|html|js|json|css|\\d+)$/.test(s[1])?s[0]+'.'+s[1]:s[0];})(nom);
  var JSON_NOM = RACINE + '.json';
  var HTML_NOM = RACINE + '.html';

  var $ = function(s){ return document.querySelector(s); };
  var DATA = null;

  $('#sous').textContent = 'Contenu édité : ' + JSON_NOM;
  $('#btn-telecharger').textContent = '⬇ Enregistrer ' + JSON_NOM;
  $('#lien-exercice').href = HTML_NOM;
  document.title = 'Éditeur – ' + RACINE;

  function modifie(){
    var e = $('#etat'); e.textContent = 'Modifications non enregistrées'; e.className = 'modifie';
    $('#btn-telecharger').disabled = false;
  }

  /* ===== Chargement ===== */
  function appliquer(d){
    if (!d || !Array.isArray(d.sections) || !d.sections.length || d.sections.some(function(s){return !s.id || (s.type==='choix' ? !Array.isArray(s.questions) || s.questions.some(function(q){return !Array.isArray(q.o) || !Number.isInteger(q.r) || q.r<0 || q.r>=q.o.length;}) : !Array.isArray(s.lignes));})) throw new Error('Données invalides');
    memoriser(d);

    DATA = d;
    $('#chargement').hidden = !LOCAL; $('#chargement').classList.toggle('visible', LOCAL);
    rendre();
    $('#btn-telecharger').disabled = false;
    var e = $('#etat'); e.textContent = 'Aucune modification'; e.className = '';
  }
  lireDonnees(new URL(JSON_NOM, location.href).href)
    .then(function(r){ if(!r.ok) throw new Error(); return r.json(); })
    .then(appliquer)
    .catch(function(){ if(LOCAL){ $('#chargement').hidden=false; $('#chargement').classList.add('visible'); } else { var erreur=document.createElement('p'); erreur.textContent='Erreur : données non chargées.'; document.body.appendChild(erreur); } });

  $('#chargement-fichier').addEventListener('change', function(ev){
    var f = ev.target.files[0]; if(!f) return;
    var fr = new FileReader();
    fr.onload = function(){ try{ appliquer(JSON.parse(fr.result)); }catch(x){ alert('Fichier JSON invalide.'); } };
    fr.readAsText(f);
  });

  /* ===== Enregistrement ===== */
  $('#btn-telecharger').addEventListener('click', function(){
    if(!DATA) return;
    var blob = new Blob([JSON.stringify(DATA,null,2)+'\n'], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = JSON_NOM;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
    var e = $('#etat'); e.textContent = 'Fichier téléchargé : remplacez ' + JSON_NOM + ' dans votre dossier'; e.className = '';
  });
  window.addEventListener('beforeunload', function(ev){
    if($('#etat').className === 'modifie'){ ev.preventDefault(); ev.returnValue=''; }
  });

  /* ===== Formulaire ===== */
  function champ(parent, obj, cle, etiquette, multi){
    var l = document.createElement('label'); l.textContent = etiquette; parent.appendChild(l);
    var el = document.createElement(multi ? 'textarea' : 'input');
    if(!multi) el.type = 'text';
    el.value = obj[cle] || '';
    el.addEventListener('input', function(){ obj[cle] = el.value; modifie(); });
    parent.appendChild(el);
    return el;
  }
  function champTab(parent, tab, i, placeholder){
    var el = document.createElement('input'); el.type='text'; el.value = tab[i]; el.placeholder = placeholder||'';
    el.addEventListener('input', function(){ tab[i] = el.value; modifie(); });
    return el;
  }

  function rendre(){
    var f = $('#formulaire'); f.innerHTML = '';

    var g = document.createElement('div'); g.className='carte';
    g.innerHTML = '<h2>En-tête de la page</h2>';
    champ(g, DATA, 'titre', 'Titre principal');
    champ(g, DATA, 'sousTitre', 'Sous-titre');
    f.appendChild(g);

    DATA.sections.forEach(function(s, si){
      var c = document.createElement('div'); c.className='carte';
      c.innerHTML = '<h2>Section ' + (si+1) + (s.type==='choix' ? ' — questions à choix' : ' — associations') + '</h2>';
      champ(c, s, 'titre', 'Intitulé de la section');
      champ(c, s, 'consigne', 'Consigne', true);

      if(s.type === 'choix'){
        s.questions.forEach(function(q, qi){
          var b = document.createElement('div'); b.className='bloc';
          b.innerHTML = '<div class="bloc-titre">Question ' + (qi+1) + '</div>';
          champ(b, q, 'q', 'Énoncé', true);
          var l = document.createElement('label'); l.textContent = 'Réponses (cocher la bonne)'; b.appendChild(l);
          var nomRadio = 'r-' + si + '-' + qi;
          q.o.forEach(function(txt, oi){
            var ligne = document.createElement('div'); ligne.className='opt';
            var rd = document.createElement('input'); rd.type='radio'; rd.name=nomRadio; rd.checked = (q.r===oi);
            rd.title = 'Bonne réponse';
            rd.addEventListener('change', function(){ q.r = oi; modifie(); });
            ligne.appendChild(rd);
            ligne.appendChild(champTab(ligne, q.o, oi, 'Réponse ' + (oi+1)));
            b.appendChild(ligne);
          });
          champ(b, q, 'e', 'Explication affichée après la réponse', true);
          c.appendChild(b);
        });
      } else {
        var aide = document.createElement('p'); aide.className='aide';
        aide.textContent = 'Chaque ligne associe un élément de gauche à sa réponse de droite.';
        c.appendChild(aide);
        s.lignes.forEach(function(l, li){
          var b = document.createElement('div'); b.className='bloc';
          b.innerHTML = '<div class="bloc-titre">Ligne ' + (li+1) + '</div>';
          var p = document.createElement('div'); p.className='paire';
          var a = document.createElement('div'); champ(a, l, 'g', 'Élément (gauche)', true);
          var d = document.createElement('div'); champ(d, l, 'd', 'Réponse attendue (droite)', true);
          p.appendChild(a); p.appendChild(d); b.appendChild(p);
          c.appendChild(b);
        });
      }
      f.appendChild(c);
    });
  }
})();
</script>
</body>
</html>
