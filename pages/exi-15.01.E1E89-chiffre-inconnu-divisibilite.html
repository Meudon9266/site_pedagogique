<!DOCTYPE html>
<html lang="fr">
<head>
  <meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le chiffre inconnu – critères de divisibilité</title>
<style>
:root{
  --paper:#FAFCFF; --grid:#DCE7F5; --ink:#1E3557; --soft:#5A6E8C;
  --mark:#F7DB5E; --good:#23794A; --good-bg:#E3F3E8; --bad:#C3332B; --bad-bg:#FBE6E4;
  --btn:#FFFFFF; --line:#B9C8DD;
  --scale:1;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141B26; --grid:#1F2A3A; --ink:#E4ECF7; --soft:#9DB0CB;
    --mark:#8A7414; --good:#6FD39A; --good-bg:#173526; --bad:#FF8A80; --bad-bg:#3A1C1A;
    --btn:#1B2533; --line:#34445C;
  }
}
:root[data-theme="dark"]{
  --paper:#141B26; --grid:#1F2A3A; --ink:#E4ECF7; --soft:#9DB0CB;
  --mark:#8A7414; --good:#6FD39A; --good-bg:#173526; --bad:#FF8A80; --bad-bg:#3A1C1A;
  --btn:#1B2533; --line:#34445C;
}
*,*::before,*::after{box-sizing:inherit}
html{font-size:calc(17px * var(--scale))}
body{
  margin:0; color:var(--ink);
  font-family:"Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px, transparent 1px),linear-gradient(90deg,var(--grid) 1px, transparent 1px);
  background-size:24px 24px;
  min-height:100vh;
}
main{max-width:46rem;margin:0 auto;padding:1.25rem 1rem 3rem}
.back{display:inline-block;margin-bottom:1rem;color:var(--ink);font-weight:700;text-decoration:none}
.back:hover{text-decoration:underline}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;margin:.2rem 0 .3rem;font-weight:700}
.sub{color:var(--soft);margin:0;max-width:34rem;line-height:1.45}
.tools{display:flex;gap:.4rem;align-items:center}
.tools button{font:inherit;font-size:.95rem;border:1px solid var(--line);background:var(--btn);color:var(--ink);border-radius:.4rem;padding:.3rem .6rem;cursor:pointer}
.score{font-variant-numeric:tabular-nums;color:var(--soft);font-size:.95rem;margin-right:.4rem}

.filters{display:flex;flex-wrap:wrap;gap:.4rem;margin:1.2rem 0 1rem}
.filters button{font:inherit;font-size:.95rem;border:1.5px solid var(--line);background:var(--btn);color:var(--ink);border-radius:2rem;padding:.35rem .85rem;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.sheet{background:var(--paper);border:1.5px solid var(--ink);border-radius:.3rem;padding:1.4rem 1.2rem 1.2rem;box-shadow:4px 4px 0 var(--grid)}
.question{font-size:1.15rem;line-height:1.5;margin:0 0 1rem}
.question strong{white-space:nowrap}

.number{display:flex;justify-content:center;gap:.25rem;margin:.6rem 0 1.4rem}
.d{font-size:3.2rem;font-weight:600;font-variant-numeric:tabular-nums;width:1.05em;text-align:center;line-height:1.2}
.d.unk{background:var(--mark);border-bottom:3px solid var(--ink);border-radius:.15rem .15rem 0 0;color:var(--ink)}
.d.unk.preview{color:var(--soft)}

.pad{display:grid;grid-template-columns:repeat(10,1fr);gap:.4rem}
.k{font:inherit;font-size:1.5rem;font-weight:600;aspect-ratio:1/1.1;border:1.5px solid var(--line);background:var(--btn);color:var(--ink);border-radius:.4rem;cursor:pointer;position:relative;font-variant-numeric:tabular-nums;min-width:0;padding:0}
.k[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.k.ok{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.k.missed{border:2.5px dashed var(--good);color:var(--good);background:var(--btn)}
.k.wrong{background:var(--bad-bg);color:var(--bad);border-color:var(--bad);text-decoration:line-through}
.k:disabled{cursor:default}
.none-row{display:flex;justify-content:center;margin-top:.6rem}
.none{font:inherit;font-size:.95rem;border:1.5px solid var(--line);background:var(--btn);color:var(--ink);border-radius:.4rem;padding:.35rem .9rem;cursor:pointer}
.none[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.none.ok{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.none.wrong{background:var(--bad-bg);color:var(--bad);border-color:var(--bad);text-decoration:line-through}
.none.missed{border:2.5px dashed var(--good);color:var(--good)}

.actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.2rem;justify-content:center}
.actions button{font:inherit;font-size:1rem;font-weight:600;border-radius:.4rem;padding:.55rem 1.1rem;cursor:pointer;border:1.5px solid var(--ink)}
.primary{background:var(--ink);color:var(--paper)}
.secondary{background:var(--btn);color:var(--ink)}
.actions button[hidden]{display:none}

.msg{min-height:1.6rem;text-align:center;margin-top:1rem;font-weight:600;line-height:1.4}
.msg.good{color:var(--good)} .msg.bad{color:var(--bad)}

.corr{margin-top:1.2rem;border-top:1.5px dashed var(--line);padding-top:1rem}
.corr p{margin:.2rem 0 .8rem;line-height:1.45}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
td{padding:.35rem .5rem;border-bottom:1px solid var(--grid);vertical-align:top}
td.n{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
td.n b{background:var(--mark);padding:0 .1em;border-radius:.1em}
td.v{white-space:nowrap;font-weight:700;text-align:right}
tr.yes td.v{color:var(--good)} tr.no td.v{color:var(--bad)}
tr.no td{color:var(--soft)}

button:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
@media (max-width:520px){
  .pad{grid-template-columns:repeat(5,1fr)}
  .d{font-size:2.6rem}
}
@media (prefers-reduced-motion:no-preference){
  .sheet.shake{animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
}
</style>
</head>
<body>
<main>
<header>
    <div>
      <h1>Le chiffre inconnu</h1>
      <p class="sub">Trouve <em>tous</em> les chiffres qui peuvent remplacer la case jaune. Clique sur chaque chiffre qui convient, puis vérifie.</p>
    </div>
    <div class="tools">
      <span class="score" id="score">0 / 0</span>
      <button id="aminus" aria-label="Réduire le texte">A−</button>
      <button id="aplus" aria-label="Agrandir le texte">A+</button>
    </div>
  </header>

  <div class="filters" id="filters" role="group" aria-label="Choisir le critère"></div>

  <section class="sheet" id="sheet">
    <p class="question" id="question"></p>
    <div class="number" id="number" aria-live="polite"></div>
    <div class="pad" id="pad"></div>
    <div class="none-row"><button class="none" id="none" aria-pressed="false">Aucun chiffre ne convient</button></div>
    <div class="actions">
      <button class="primary" id="check">Vérifier</button>
      <button class="secondary" id="show" hidden>Voir la correction</button>
      <button class="primary" id="next" hidden>Nombre suivant</button>
    </div>
    <div class="msg" id="msg" role="status"></div>
    <div class="corr" id="corr" hidden></div>
  </section>
</main>

<script>
(function(){
const $ = id => document.getElementById(id);
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const digitSum = s => s.split('').reduce((t,c)=>t+ +c,0);
const sumText = s => s.split('').join(' + ') + ' = ' + digitSum(s);

const CRITS = {
  d4:{name:'÷ 4', phrase:'divisible par <strong>4</strong>',
      rule:'Un nombre est divisible par 4 si le nombre formé par ses <strong>deux derniers chiffres</strong> est divisible par 4.',
      explain(s){const t=s.slice(-2),v=+t,ok=v%4===0;
        return {ok,text:`deux derniers chiffres : ${t} → ${ok? v+' = 4 × '+(v/4) : v+' n’est pas dans la table de 4'}`};}},
  d6:{name:'÷ 6', phrase:'divisible par <strong>6</strong>',
      rule:'Un nombre est divisible par 6 s’il est divisible <strong>par 2 et par 3</strong> : il est pair <em>et</em> la somme de ses chiffres est un multiple de 3.',
      explain(s){const even=+s.slice(-1)%2===0,sum=digitSum(s),t3=sum%3===0;
        return {ok:even&&t3,text:`${even?'pair ✓':'impair ✗'} ; somme ${sumText(s)} ${t3?'✓ multiple de 3':'✗ pas un multiple de 3'}`};}},
  d25:{name:'÷ 2 et 5', phrase:'divisible par <strong>2 et par 5</strong>',
      rule:'Divisible par 2 : dernier chiffre pair. Divisible par 5 : dernier chiffre 0 ou 5. Les deux à la fois : le dernier chiffre doit être <strong>0</strong>.',
      explain(s){const u=+s.slice(-1),ok=u===0;
        return {ok,text:`dernier chiffre : ${u}${ok?' → pair et 0 ou 5':(u%2===0?' → pair, mais ni 0 ni 5':(u===5?' → 5, mais impair':' → ni pair, ni 0 ou 5'))}`};}},
  d3:{name:'÷ 3', phrase:'divisible par <strong>3</strong>',
      rule:'Un nombre est divisible par 3 si la <strong>somme de ses chiffres</strong> est un multiple de 3.',
      explain(s){const sum=digitSum(s),ok=sum%3===0;
        return {ok,text:`somme ${sumText(s)} ${ok?'= 3 × '+(sum/3):'→ pas un multiple de 3'}`};}},
  d9:{name:'÷ 9', phrase:'divisible par <strong>9</strong>',
      rule:'Un nombre est divisible par 9 si la <strong>somme de ses chiffres</strong> est un multiple de 9.',
      explain(s){const sum=digitSum(s),ok=sum%9===0;
        return {ok,text:`somme ${sumText(s)} ${ok?'= 9 × '+(sum/9):'→ pas un multiple de 9'}`};}},
};
const MIX = ['d4','d6','d25','d3','d9'];

let filter='mix', q=null, chosen=new Set(), noneChosen=false, state='answer', tries=0;
let score={ok:0,total:0};

// ---- font size ----
let scale=1;
try{const s=parseFloat(localStorage.getItem('ci-scale')); if(s) scale=s;}catch(e){}
const applyScale=()=>{document.documentElement.style.setProperty('--scale',scale);try{localStorage.setItem('ci-scale',scale)}catch(e){}};
applyScale();
$('aminus').onclick=()=>{scale=Math.max(.75,+(scale-.1).toFixed(2));applyScale()};
$('aplus').onclick=()=>{scale=Math.min(1.8,+(scale+.1).toFixed(2));applyScale()};

// ---- filters ----
const fl=$('filters');
[['mix','Mélange'],...MIX.map(k=>[k,CRITS[k].name])].forEach(([k,label])=>{
  const b=document.createElement('button'); b.textContent=label; b.dataset.k=k;
  b.setAttribute('aria-pressed',k===filter);
  b.onclick=()=>{filter=k;[...fl.children].forEach(x=>x.setAttribute('aria-pressed',x.dataset.k===k));newQ();};
  fl.appendChild(b);
});

// ---- pad ----
const pad=$('pad');
for(let d=0;d<10;d++){
  const b=document.createElement('button'); b.className='k'; b.textContent=d; b.dataset.d=d;
  b.setAttribute('aria-pressed','false'); b.setAttribute('aria-label','chiffre '+d);
  b.onclick=()=>toggle(d);
  b.onmouseenter=()=>preview(d); b.onmouseleave=()=>preview(null);
  b.onfocus=()=>preview(d); b.onblur=()=>preview(null);
  pad.appendChild(b);
}
$('none').onclick=()=>{ if(state!=='answer')return; noneChosen=!noneChosen; if(noneChosen) chosen.clear(); syncPad(); };

function toggle(d){
  if(state!=='answer')return;
  chosen.has(d)?chosen.delete(d):chosen.add(d);
  if(chosen.size) noneChosen=false;
  syncPad();
}
function syncPad(){
  [...pad.children].forEach(b=>b.setAttribute('aria-pressed',chosen.has(+b.dataset.d)));
  $('none').setAttribute('aria-pressed',noneChosen);
}
function preview(d){
  const el=document.querySelector('.d.unk'); if(!el||state!=='answer')return;
  if(d===null){el.textContent='?';el.classList.remove('preview');}
  else{el.textContent=d;el.classList.add('preview');}
}

// ---- generation ----
function make(){
  const crit = filter==='mix' ? MIX[rnd(0,MIX.length-1)] : filter;
  for(let guard=0;guard<200;guard++){
    const len=rnd(3,5);
    const digits=[rnd(1,9)]; for(let i=1;i<len;i++) digits.push(rnd(0,9));
    // position : jamais le premier chiffre ; plus souvent à la fin ou juste avant
    const r=Math.random();
    let pos = r<.45 ? len-1 : (r<.7 ? len-2 : rnd(1,len-1));
    const sols=[];
    for(let d=0;d<10;d++){ const s=digits.map((x,i)=>i===pos?d:x).join(''); if(CRITS[crit].explain(s).ok) sols.push(d); }
    // les cas « tous » ou « aucun » sont instructifs, mais pas trop souvent
    if((sols.length===0||sols.length===10) && Math.random()>.25) continue;
    return {crit,digits,pos,sols};
  }
}
function newQ(){
  q=make(); chosen.clear(); noneChosen=false; state='answer'; tries=0;
  $('question').innerHTML=`Quels chiffres peuvent remplacer la case pour que le nombre soit ${CRITS[q.crit].phrase} ?`;
  const n=$('number'); n.innerHTML='';
  q.digits.forEach((x,i)=>{const s=document.createElement('span');s.className='d'+(i===q.pos?' unk':'');s.textContent=i===q.pos?'?':x;n.appendChild(s);});
  [...pad.children].forEach(b=>{b.className='k';b.disabled=false;});
  const nb=$('none'); nb.className='none'; nb.disabled=false;
  syncPad();
  $('msg').textContent=''; $('msg').className='msg';
  $('corr').hidden=true; $('check').hidden=false; $('show').hidden=true; $('next').hidden=true;
}

// ---- checking ----
function check(){
  if(state!=='answer')return;
  if(!chosen.size && !noneChosen){ $('msg').className='msg bad'; $('msg').textContent='Choisis au moins un chiffre, ou « Aucun chiffre ne convient ».'; return; }
  tries++;
  const sol=new Set(q.sols);
  const wrong=[...chosen].filter(d=>!sol.has(d)).length;
  const missing=q.sols.filter(d=>!chosen.has(d)).length;
  const correct = q.sols.length===0 ? noneChosen : (wrong===0 && missing===0);
  if(correct){
    if(tries===1) score.ok++; score.total++; updScore();
    $('msg').className='msg good';
    $('msg').textContent = q.sols.length===0 ? 'Bravo ! Aucun chiffre ne convient.' : (q.sols.length===10 ? 'Bravo ! Tous les chiffres conviennent.' : 'Bravo ! Tu as trouvé tous les chiffres.');
    finish(true);
  }else{
    const m=$('msg'); m.className='msg bad';
    let parts=[];
    if(noneChosen) parts.push('Il y a au moins un chiffre qui convient.');
    else if(q.sols.length===0) parts.push('Aucun des chiffres choisis ne convient… en existe-t-il vraiment un ?');
    else{
      if(wrong) parts.push(wrong===1?'1 chiffre choisi ne convient pas.':wrong+' chiffres choisis ne conviennent pas.');
      if(missing) parts.push(missing===1?'Il manque 1 chiffre.':'Il manque '+missing+' chiffres.');
    }
    m.textContent='Pas encore. '+parts.join(' ');
    const sh=$('sheet'); sh.classList.remove('shake'); void sh.offsetWidth; sh.classList.add('shake');
    $('show').hidden=false;
  }
}
function finish(success){
  state='done';
  const sol=new Set(q.sols);
  [...pad.children].forEach(b=>{
    const d=+b.dataset.d; b.disabled=true;
    if(sol.has(d)) b.classList.add(chosen.has(d)?'ok':'missed');
    else if(chosen.has(d)) b.classList.add('wrong');
  });
  const nb=$('none'); nb.disabled=true;
  if(q.sols.length===0) nb.classList.add(noneChosen?'ok':'missed'); else if(noneChosen) nb.classList.add('wrong');
  const unk=document.querySelector('.d.unk'); unk.classList.remove('preview'); unk.textContent='?';
  $('check').hidden=true; $('show').hidden=!success; $('show').textContent='Voir le détail'; $('next').hidden=false;
  if(!success) showCorr();
  $('next').focus();
}
function showCorr(){
  if(state==='answer'){ score.total++; updScore();
    $('msg').className='msg'; $('msg').textContent='Voici la correction. Les chiffres en pointillés étaient à trouver.';
    finish(false); return; }
  const c=CRITS[q.crit], box=$('corr');
  let rows='';
  for(let d=0;d<10;d++){
    const s=q.digits.map((x,i)=>i===q.pos?d:x).join('');
    const e=c.explain(s);
    const shown=q.digits.map((x,i)=>i===q.pos?`<b>${d}</b>`:x).join('');
    rows+=`<tr class="${e.ok?'yes':'no'}"><td class="n">${shown}</td><td>${e.text}</td><td class="v">${e.ok?'oui':'non'}</td></tr>`;
  }
  const res = q.sols.length===0 ? 'Aucun chiffre ne convient.' : (q.sols.length===10?'Tous les chiffres conviennent.':'Chiffres possibles : <strong>'+q.sols.join(', ')+'</strong>.');
  box.innerHTML=`<p>${c.rule}</p><p>${res}</p><div class="tablewrap"><table>${rows}</table></div>`;
  box.hidden=false; $('show').hidden=true;
}
function updScore(){ $('score').textContent=`${score.ok} / ${score.total}`; $('score').title='réussis du premier coup / nombres traités'; }

$('check').onclick=check;
$('show').onclick=showCorr;
$('next').onclick=newQ;
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='BUTTON' && (e.key==='Enter'||e.key===' ')) return;
  if(/^[0-9]$/.test(e.key)){ toggle(+e.key); e.preventDefault(); }
  else if(e.key==='Enter'){ state==='answer'?check():newQ(); e.preventDefault(); }
});

updScore(); newQ();
})();
</script>
</body>
</html>
