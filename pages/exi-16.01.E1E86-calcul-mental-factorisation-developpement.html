    <h1>Factorisation et développement</h1>

    const decode=value=>new TextDecoder().decode(Uint8Array.from(atob(value),character=>character.charCodeAt(0)));
    const frames={n1:document.getElementById('frame-n1'),n2:document.getElementById('frame-n2')};
    const loaded={n1:false,n2:false};
    function ensureLoaded(level){if(!loaded[level]){frames[level].srcdoc=decode(sources[level]);loaded[level]=true}}
    function show(level){
      for(const key of ['n1','n2']){
        const selected=key===level;
        document.getElementById('tab-'+key).setAttribute('aria-selected',String(selected));
        document.getElementById('panel-'+key).hidden=!selected;
      }
      ensureLoaded(level);
    }
    document.getElementById('tab-n1').addEventListener('click',()=>show('n1'));
    document.getElementById('tab-n2').addEventListener('click',()=>show('n2'));
    document.querySelector('.tabs').addEventListener('keydown',event=>{
      if(!['ArrowLeft','ArrowRight'].includes(event.key))return;
      event.preventDefault();
      const next=document.getElementById(event.target.id==='tab-n1'?'tab-n2':'tab-n1');
      next.focus();next.click();
    });
    ensureLoaded('n1');
  </script>
