<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Éditeur de données</title>
<style>
  :root {
    --fond: #fbf9f4; --texte: #26231f; --doux: #6b655b; --carte: #ffffff;
    --bord: #d9d2c3; --accent: #9a4a2b; --accent-texte: #ffffff;
    --ok: #2f7a4f; --ok-fond: #e5f3ea; --ko: #b3382c; --ko-fond: #fbe9e6; --moyen: #8a6a12; --moyen-fond: #fbf1d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fond: #1c1a17; --texte: #ece7dc; --doux: #a59d8d; --carte: #26231f;
      --bord: #3f3a32; --accent: #d98458; --accent-texte: #1c1a17;
      --ok: #7ccf9c; --ok-fond: #1e3327; --ko: #f08a7e; --ko-fond: #3a2220; --moyen: #e5c36a; --moyen-fond: #372f17;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fond); color: var(--texte); font: 16px/1.45 Georgia, 'Times New Roman', serif; }
  header.haut { position: sticky; top: 0; z-index: 5; background: var(--fond); border-bottom: 1px solid var(--bord); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  header.haut h1 { font-size: 1.1rem; margin: 0; flex: 1 1 auto; }
  #etat { font-size: .9rem; color: var(--doux); }
  #etat.modif { color: var(--moyen); font-weight: bold; }
  .mise { display: grid; grid-template-columns: minmax(220px, 300px) 1fr; gap: 16px; max-width: 1100px; margin: 0 auto; padding: 16px; }
  @media (max-width: 760px) { .mise { grid-template-columns: 1fr; } }
  nav.liste { background: var(--carte); border: 1px solid var(--bord); border-radius: 8px; padding: 8px; align-self: start; }
  nav.liste h2 { font-size: .85rem; text-transform: uppercase; letter-spacing: .04em; color: var(--doux); margin: 10px 6px 4px; }
  nav.liste button.item { display: flex; width: 100%; justify-content: space-between; text-align: left; border: 0; background: transparent; padding: 7px 8px; border-radius: 6px; }
  nav.liste button.item:hover { background: var(--fond); }
  nav.liste button.item.actif { background: var(--accent); color: var(--accent-texte); }
  .pastille { font-size: .75rem; padding: 0 6px; border-radius: 10px; background: var(--ko); color: #fff; align-self: center; }
  section.fiche { background: var(--carte); border: 1px solid var(--bord); border-radius: 8px; padding: 16px; min-width: 0; }
  section.fiche h2 { margin: 0 0 12px; font-size: 1.2rem; }
  h3 { font-size: 1rem; margin: 20px 0 6px; }
  label.champ { display: block; margin: 10px 0; font-weight: bold; font-size: .92rem; }
  label.champ small { font-weight: normal; color: var(--doux); }
  input[type=text], textarea, select { width: 100%; font: inherit; color: inherit; background: var(--fond); border: 1px solid var(--bord); border-radius: 6px; padding: 6px 8px; }
  textarea { resize: vertical; min-height: 2.6em; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--bord); background: var(--carte); color: var(--texte); border-radius: 8px; padding: 6px 12px; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.primaire { background: var(--accent); color: var(--accent-texte); border-color: var(--accent); }
  button.danger:hover { border-color: var(--ko); color: var(--ko); }
  button.petit { padding: 3px 9px; font-size: .9rem; }
  .ligne { display: flex; gap: 8px; align-items: flex-start; margin: 6px 0; }
  .ligne > .grow { flex: 1 1 auto; min-width: 0; }
  .ligne .vf { flex: 0 0 90px; }
  .bloc { border: 1px solid var(--bord); border-radius: 8px; padding: 8px 10px; margin: 8px 0; background: var(--fond); }
  .bloc .ligne { margin: 4px 0; }
  .voisins { display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .voisins label { font-weight: normal; }
  .aide { color: var(--doux); font-size: .9rem; margin: 2px 0 6px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; padding-top: 12px; border-top: 1px solid var(--bord); }
  #problemes { margin: 0 0 12px; padding: 8px 12px 8px 28px; background: var(--ko-fond); border: 1px solid var(--ko); border-radius: 8px; }
  #problemes[hidden] { display: none; }
  #problemes li { margin: 2px 0; }
  #problemes a { color: inherit; }
  #accueil { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
  #accueil[hidden], .mise[hidden] { display: none; }
  #manuel { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--bord); color: var(--doux); }
  #manuel[hidden] { display: none; }
  .ok { color: var(--ok); }
</style>
</head>
<body>

<header class="haut" id="haut" hidden>
  <h1 id="titre-page">Éditeur</h1>
  <span id="etat">Aucune modification</span>
  <button id="b-enregistrer" class="primaire">Enregistrer le JSON</button>
</header>

<div id="accueil">
  <h1>Éditeur de données</h1>
  <p id="accueil-msg">Chargement du fichier de données…</p>
  <div id="manuel" hidden>
    <p>Le fichier <strong id="manuel-nom"></strong> n'a pas pu être chargé automatiquement (ouverture locale de la page, par exemple). Choisis-le toi-même :</p>
    <p><input type="file" id="manuel-fichier" accept=".json,application/json"></p>
    <p id="manuel-raison"></p>
  </div>
</div>

<div class="mise" id="mise" hidden>
  <nav class="liste" id="nav" aria-label="Termes"></nav>
  <div>
    <ul id="problemes" hidden></ul>
    <section class="fiche" id="fiche"></section>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* La racine vient du nom de CETTE page : « racine.editeur.html » → « racine » → données dans « racine.json ». */
  var RACINE = (function(n){var s=n.split('.');return s.length>2&&!/^(editeur|voc|menu|listeQuiz|html|js|json|css|\\d+)$/.test(s[1])?s[0]+'.'+s[1]:s[0];})(decodeURIComponent(location.pathname.split('/').pop() || ''));
  var NOM_JSON = RACINE + '.json';

  var data = null;          // objet JSON en cours d'édition
  var courant = 'general';  // 'general' | 'groupes' | id d'un terme
  var modifie = false;
  var handle = null;        // fichier choisi via l'API d'accès aux fichiers (si dispo)

  function $(id) { return document.getElementById(id); }

  /* ---------- petits utilitaires DOM ---------- */
  function el(tag, attrs, enfants) {
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'texte') e.textContent = attrs[k];
      else if (k === 'classe') e.className = attrs[k];
      else if (k.slice(0, 2) === 'on') e[k] = attrs[k];
      else e.setAttribute(k, attrs[k]);
    });
    (enfants || []).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function marquer() {
    modifie = true;
    var s = $('etat'); s.textContent = 'Modifications non enregistrées'; s.className = 'modif';
    verifierEtMontrer();
  }
  function champTexte(etiquette, valeur, surChange, opts) {
    opts = opts || {};
    var saisie = opts.multi ? el('textarea', { rows: opts.rows || 2 }) : el('input', { type: 'text' });
    saisie.value = valeur || '';
    saisie.addEventListener('input', function () { surChange(saisie.value); marquer(); });
    return el('label', { classe: 'champ' }, [etiquette, opts.aide ? el('small', { texte: ' — ' + opts.aide }) : null, saisie]);
  }
  function slug(s) {
    return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  }
  function idUnique(base) {
    var b = slug(base) || 'terme', id = b, n = 2;
    while (trouver(id)) { id = b + '-' + n++; }
    return id;
  }
  function trouver(id) {
    for (var i = 0; i < data.termes.length; i++) if (data.termes[i].id === id) return data.termes[i];
    return null;
  }

  /* ---------- validation ---------- */
  function verifier() {
    var pb = [];
    var gids = {};
    data.groupes.forEach(function (g) {
      if (!g.id) pb.push({ cible: 'groupes', msg: 'Un groupe n\'a pas d\'identifiant.' });
      else if (gids[g.id]) pb.push({ cible: 'groupes', msg: 'Identifiant de groupe en double : « ' + g.id + ' ».' });
      gids[g.id] = true;
    });
    var tids = {};
    data.termes.forEach(function (t) { tids[t.id] = (tids[t.id] || 0) + 1; });
    data.termes.forEach(function (t) {
      var nom = '« ' + (t.terme || t.id || '?') + ' » : ';
      function p(msg) { pb.push({ cible: t.id, msg: nom + msg }); }
      if (!t.id) p('identifiant vide.');
      if (tids[t.id] > 1) p('identifiant en double.');
      if (!t.terme) p('le mot affiché est vide.');
      if (!gids[t.groupe]) p('groupe inconnu.');
      if (!t.definition) p('définition vide.');
      var d = (t.detrompeurs || []).filter(function (x) { return x && x.trim(); });
      if (d.length < 2) p('il faut au moins 2 fausses définitions (détrompeurs).');
      if (d.length > 4) p('plus de 4 détrompeurs (inutile, seuls 3 sont utilisés).');
      if (d.indexOf(t.definition) >= 0) p('un détrompeur est identique à la bonne définition.');
      (t.voisins || []).forEach(function (v) { if (!tids[v]) p('voisin inconnu « ' + v + ' ».'); if (v === t.id) p('un terme ne peut pas être son propre voisin.'); });
      (t.vrai_faux || []).forEach(function (q, i) { if (!q.enonce) p('affirmation vrai/faux n° ' + (i + 1) + ' vide.'); });
      (t.trous || []).forEach(function (q, i) {
        if (!q.texte || q.texte.indexOf('___') < 0) p('phrase à trous n° ' + (i + 1) + ' : il manque « ___ ».');
        if (!q.mot) p('phrase à trous n° ' + (i + 1) + ' : mot manquant.');
      });
    });
    return pb;
  }
  function verifierEtMontrer() {
    var pb = verifier();
    var ul = $('problemes');
    ul.textContent = '';
    ul.hidden = pb.length === 0;
    pb.forEach(function (x) {
      var li = el('li');
      var a = el('a', { href: '#', texte: x.msg });
      a.addEventListener('click', function (e) { e.preventDefault(); aller(x.cible); });
      li.appendChild(a); ul.appendChild(li);
    });
    // pastilles dans la navigation (sans reconstruire la fiche)
    var par = {};
    pb.forEach(function (x) { par[x.cible] = (par[x.cible] || 0) + 1; });
    var items = $('nav').querySelectorAll('button.item');
    Array.prototype.forEach.call(items, function (b) {
      var old = b.querySelector('.pastille'); if (old) old.remove();
      var n = par[b.getAttribute('data-id')];
      if (n) b.appendChild(el('span', { classe: 'pastille', texte: String(n) }));
    });
    return pb;
  }

  /* ---------- navigation ---------- */
  function aller(id) { courant = id; dessinerNav(); dessinerFiche(); verifierEtMontrer(); window.scrollTo(0, 0); }

  function dessinerNav() {
    var nav = $('nav'); nav.textContent = '';
    function item(id, texte) {
      var b = el('button', { classe: 'item' + (id === courant ? ' actif' : ''), 'data-id': id, type: 'button' }, [el('span', { texte: texte })]);
      b.addEventListener('click', function () { aller(id); });
      return b;
    }
    nav.appendChild(el('h2', { texte: 'Général' }));
    nav.appendChild(item('general', 'Titre et consigne'));
    nav.appendChild(item('groupes', 'Groupes (' + data.groupes.length + ')'));
    nav.appendChild(el('h2', { texte: 'Termes (' + data.termes.length + ')' }));
    var vus = {};
    data.groupes.forEach(function (g) {
      var ts = data.termes.filter(function (t) { return t.groupe === g.id; });
      if (!ts.length) return;
      nav.appendChild(el('h2', { texte: g.titre || g.id }));
      ts.forEach(function (t) { vus[t.id] = true; nav.appendChild(item(t.id, t.terme || t.id)); });
    });
    var autres = data.termes.filter(function (t) { return !vus[t.id]; });
    if (autres.length) {
      nav.appendChild(el('h2', { texte: 'Sans groupe valide' }));
      autres.forEach(function (t) { nav.appendChild(item(t.id, t.terme || t.id)); });
    }
    var ajout = el('button', { classe: 'primaire', type: 'button', texte: '+ Nouveau terme', style: 'width:100%;margin-top:10px' });
    ajout.addEventListener('click', nouveauTerme);
    nav.appendChild(ajout);
  }

  /* ---------- fiches ---------- */
  function dessinerFiche() {
    var f = $('fiche'); f.textContent = '';
    if (courant === 'general') return ficheGenerale(f);
    if (courant === 'groupes') return ficheGroupes(f);
    var t = trouver(courant);
    if (!t) { courant = 'general'; return ficheGenerale(f); }
    ficheTerme(f, t);
  }

  function ficheGenerale(f) {
    f.appendChild(el('h2', { texte: 'Titre et consigne' }));
    f.appendChild(champTexte('Titre de l\'exercice', data.titre, function (v) { data.titre = v; }));
    f.appendChild(champTexte('Consigne affichée sur la page d\'accueil', data.consigne, function (v) { data.consigne = v; }, { multi: true, rows: 3 }));
    f.appendChild(el('p', { classe: 'aide', texte: 'Le bloc « _aide » (notice du fichier) est conservé tel quel.' }));
  }

  function ficheGroupes(f) {
    f.appendChild(el('h2', { texte: 'Groupes de termes' }));
    f.appendChild(el('p', { classe: 'aide', texte: 'Les groupes permettent à l\'élève de choisir sur quoi s\'exercer. L\'identifiant est court, sans accent ni espace.' }));
    data.groupes.forEach(function (g, i) {
      var nbTermes = data.termes.filter(function (t) { return t.groupe === g.id; }).length;
      var idChamp = el('input', { type: 'text', 'aria-label': 'Identifiant' });
      idChamp.value = g.id || '';
      idChamp.addEventListener('change', function () {
        var ancien = g.id, neuf = slug(idChamp.value) || ancien;
        if (data.groupes.some(function (x, j) { return j !== i && x.id === neuf; })) { alert('Cet identifiant existe déjà.'); neuf = ancien; }
        data.termes.forEach(function (t) { if (t.groupe === ancien) t.groupe = neuf; });
        g.id = neuf; idChamp.value = neuf; marquer(); dessinerNav();
      });
      var titreChamp = el('input', { type: 'text', 'aria-label': 'Titre' });
      titreChamp.value = g.titre || '';
      titreChamp.addEventListener('input', function () { g.titre = titreChamp.value; marquer(); });
      titreChamp.addEventListener('change', dessinerNav);
      var haut = el('button', { classe: 'petit', type: 'button', texte: '↑', title: 'Monter', onclick: function () { deplacer(data.groupes, i, -1); } });
      var bas = el('button', { classe: 'petit', type: 'button', texte: '↓', title: 'Descendre', onclick: function () { deplacer(data.groupes, i, 1); } });
      var sup = el('button', { classe: 'petit danger', type: 'button', texte: '✕', title: 'Supprimer', onclick: function () {
        if (nbTermes) { alert('Ce groupe contient encore ' + nbTermes + ' terme(s) : déplace-les d\'abord dans un autre groupe.'); return; }
        data.groupes.splice(i, 1); marquer(); dessinerNav(); dessinerFiche();
      } });
      f.appendChild(el('div', { classe: 'bloc' }, [
        el('div', { classe: 'ligne' }, [el('div', { classe: 'grow' }, [el('small', { texte: 'Identifiant' }), idChamp]), el('div', { classe: 'grow' }, [el('small', { texte: 'Titre affiché' }), titreChamp])]),
        el('div', { classe: 'ligne' }, [el('span', { classe: 'aide', texte: nbTermes + ' terme(s)' }), haut, bas, sup])
      ]));
    });
    f.appendChild(el('button', { type: 'button', texte: '+ Nouveau groupe', onclick: function () {
      var id = 'groupe' + (data.groupes.length + 1);
      data.groupes.push({ id: id, titre: 'Nouveau groupe' }); marquer(); dessinerNav(); dessinerFiche();
    } }));
  }

  function deplacer(tab, i, d) {
    var j = i + d; if (j < 0 || j >= tab.length) return;
    var x = tab[i]; tab[i] = tab[j]; tab[j] = x;
    marquer(); dessinerNav(); dessinerFiche();
  }

  /* liste de chaînes éditable (détrompeurs, situations) */
  function listeChaines(f, titre, aide, tab, opts) {
    opts = opts || {};
    f.appendChild(el('h3', { texte: titre }));
    if (aide) f.appendChild(el('p', { classe: 'aide', texte: aide }));
    var zone = el('div'); f.appendChild(zone);
    function dessiner() {
      zone.textContent = '';
      tab.forEach(function (s, i) {
        var saisie = el('textarea', { rows: opts.rows || 1 });
        saisie.value = s;
        saisie.addEventListener('input', function () { tab[i] = saisie.value; marquer(); });
        zone.appendChild(el('div', { classe: 'ligne' }, [
          el('div', { classe: 'grow' }, [saisie]),
          el('button', { classe: 'petit danger', type: 'button', texte: '✕', title: 'Supprimer', onclick: function () { tab.splice(i, 1); marquer(); dessiner(); } })
        ]));
      });
    }
    dessiner();
    f.appendChild(el('button', { classe: 'petit', type: 'button', texte: '+ Ajouter', onclick: function () { tab.push(''); marquer(); dessiner(); } }));
  }

  function ficheTerme(f, t) {
    t.detrompeurs = t.detrompeurs || []; t.voisins = t.voisins || [];
    t.vrai_faux = t.vrai_faux || []; t.situations = t.situations || []; t.trous = t.trous || [];

    f.appendChild(el('h2', { texte: t.terme || t.id }));

    f.appendChild(champTexte('Mot affiché', t.terme, function (v) { t.terme = v; }));

    // identifiant (renommage = mise à jour des voisins)
    var idChamp = el('input', { type: 'text' });
    idChamp.value = t.id;
    idChamp.addEventListener('change', function () {
      var ancien = t.id, neuf = slug(idChamp.value);
      if (!neuf) { idChamp.value = ancien; return; }
      if (neuf !== ancien && trouver(neuf)) { alert('Cet identifiant est déjà pris.'); idChamp.value = ancien; return; }
      data.termes.forEach(function (x) { x.voisins = (x.voisins || []).map(function (v) { return v === ancien ? neuf : v; }); });
      t.id = neuf; courant = neuf; idChamp.value = neuf; marquer(); dessinerNav(); dessinerFiche();
    });
    f.appendChild(el('label', { classe: 'champ' }, ['Identifiant ', el('small', { texte: '— court, sans accent, unique ; les renvois « voisins » sont mis à jour' }), idChamp]));

    var sel = el('select');
    data.groupes.forEach(function (g) { var o = el('option', { value: g.id, texte: g.titre || g.id }); if (g.id === t.groupe) o.selected = true; sel.appendChild(o); });
    sel.addEventListener('change', function () { t.groupe = sel.value; marquer(); dessinerNav(); });
    f.appendChild(el('label', { classe: 'champ' }, ['Groupe', sel]));

    f.appendChild(champTexte('Définition correcte', t.definition, function (v) { t.definition = v; }, { multi: true, rows: 3 }));

    listeChaines(f, 'Détrompeurs', 'Fausses définitions plausibles (2 à 4). Elles servent de mauvaises réponses.', t.detrompeurs, { rows: 2 });

    // voisins
    f.appendChild(el('h3', { texte: 'Termes voisins' }));
    f.appendChild(el('p', { classe: 'aide', texte: 'Termes qu\'on peut confondre avec celui-ci : ils servent de mauvaises réponses quand on demande de retrouver le mot.' }));
    var vz = el('div', { classe: 'voisins' });
    data.termes.forEach(function (autre) {
      if (autre.id === t.id) return;
      var cb = el('input', { type: 'checkbox' });
      cb.checked = t.voisins.indexOf(autre.id) >= 0;
      cb.addEventListener('change', function () {
        var k = t.voisins.indexOf(autre.id);
        if (cb.checked && k < 0) t.voisins.push(autre.id);
        if (!cb.checked && k >= 0) t.voisins.splice(k, 1);
        marquer();
      });
      vz.appendChild(el('label', {}, [cb, ' ' + (autre.terme || autre.id)]));
    });
    f.appendChild(vz);

    // vrai / faux
    f.appendChild(el('h3', { texte: 'Vrai ou faux' }));
    var vfz = el('div'); f.appendChild(vfz);
    function dessinerVF() {
      vfz.textContent = '';
      t.vrai_faux.forEach(function (q, i) {
        var enonce = el('textarea', { rows: 2 }); enonce.value = q.enonce || '';
        enonce.addEventListener('input', function () { q.enonce = enonce.value; marquer(); });
        var vf = el('select'); [['true', 'Vrai'], ['false', 'Faux']].forEach(function (p) { var o = el('option', { value: p[0], texte: p[1] }); if (String(!!q.vrai) === p[0]) o.selected = true; vf.appendChild(o); });
        vf.addEventListener('change', function () { q.vrai = vf.value === 'true'; marquer(); });
        var ex = el('textarea', { rows: 2, placeholder: 'Explication (facultative)' }); ex.value = q.explication || '';
        ex.addEventListener('input', function () { if (ex.value) q.explication = ex.value; else delete q.explication; marquer(); });
        vfz.appendChild(el('div', { classe: 'bloc' }, [
          el('div', { classe: 'ligne' }, [el('div', { classe: 'grow' }, [enonce]), el('div', { classe: 'vf' }, [vf]),
            el('button', { classe: 'petit danger', type: 'button', texte: '✕', title: 'Supprimer', onclick: function () { t.vrai_faux.splice(i, 1); marquer(); dessinerVF(); } })]),
          el('div', { classe: 'ligne' }, [el('div', { classe: 'grow' }, [ex])])
        ]));
      });
    }
    dessinerVF();
    f.appendChild(el('button', { classe: 'petit', type: 'button', texte: '+ Ajouter une affirmation', onclick: function () { t.vrai_faux.push({ enonce: '', vrai: true }); marquer(); dessinerVF(); } }));

    listeChaines(f, 'Situations', 'Petits cas concrets ; la bonne réponse est toujours ce terme.', t.situations, { rows: 3 });

    // trous
    f.appendChild(el('h3', { texte: 'Phrases à compléter' }));
    f.appendChild(el('p', { classe: 'aide', texte: 'Écris « ___ » (trois tirets bas) à l\'endroit du mot manquant, et indique le mot qui le remplace.' }));
    var tz = el('div'); f.appendChild(tz);
    function dessinerTrous() {
      tz.textContent = '';
      t.trous.forEach(function (q, i) {
        var tx = el('textarea', { rows: 2 }); tx.value = q.texte || '';
        tx.addEventListener('input', function () { q.texte = tx.value; marquer(); });
        var mot = el('input', { type: 'text', placeholder: 'Mot attendu' }); mot.value = q.mot || '';
        mot.addEventListener('input', function () { q.mot = mot.value; marquer(); });
        tz.appendChild(el('div', { classe: 'bloc' }, [
          el('div', { classe: 'ligne' }, [el('div', { classe: 'grow' }, [tx]),
            el('button', { classe: 'petit danger', type: 'button', texte: '✕', title: 'Supprimer', onclick: function () { t.trous.splice(i, 1); marquer(); dessinerTrous(); } })]),
          el('div', { classe: 'ligne' }, [el('div', { classe: 'grow' }, [mot])])
        ]));
      });
    }
    dessinerTrous();
    f.appendChild(el('button', { classe: 'petit', type: 'button', texte: '+ Ajouter une phrase', onclick: function () { t.trous.push({ texte: '', mot: '' }); marquer(); dessinerTrous(); } }));

    // ecrire
    f.appendChild(el('h3', { texte: 'Question à rédiger (facultative)' }));
    f.appendChild(el('p', { classe: 'aide', texte: 'Si tu remplis la consigne, l\'élève pourra répondre avec ses mots puis s\'auto-évaluer. Vide = pas de question rédigée pour ce terme.' }));
    var ec = el('textarea', { rows: 2 }); ec.value = (t.ecrire && t.ecrire.consigne) || '';
    ec.addEventListener('input', function () {
      if (ec.value.trim()) { t.ecrire = t.ecrire || {}; t.ecrire.consigne = ec.value; } else delete t.ecrire;
      marquer();
    });
    f.appendChild(ec);

    // actions
    var actions = el('div', { classe: 'actions' });
    var i = data.termes.indexOf(t);
    actions.appendChild(el('button', { type: 'button', texte: 'Dupliquer', onclick: function () {
      var copie = JSON.parse(JSON.stringify(t));
      copie.id = idUnique(t.id); copie.terme = (t.terme || '') + ' (copie)';
      data.termes.splice(i + 1, 0, copie); courant = copie.id; marquer(); dessinerNav(); dessinerFiche();
    } }));
    actions.appendChild(el('button', { type: 'button', texte: 'Monter dans la liste', onclick: function () { deplacer(data.termes, i, -1); } }));
    actions.appendChild(el('button', { type: 'button', texte: 'Descendre dans la liste', onclick: function () { deplacer(data.termes, i, 1); } }));
    actions.appendChild(el('button', { classe: 'danger', type: 'button', texte: 'Supprimer ce terme', onclick: function () {
      if (!confirm('Supprimer le terme « ' + (t.terme || t.id) + ' » ?')) return;
      var ancien = t.id;
      data.termes.splice(i, 1);
      data.termes.forEach(function (x) { x.voisins = (x.voisins || []).filter(function (v) { return v !== ancien; }); });
      courant = 'general'; marquer(); dessinerNav(); dessinerFiche();
    } }));
    f.appendChild(actions);
  }

  function nouveauTerme() {
    var g = data.groupes[0] ? data.groupes[0].id : '';
    if (data.termes.length) { var cur = trouver(courant); g = cur ? cur.groupe : data.termes[data.termes.length - 1].groupe; }
    var t = { id: idUnique('nouveau'), terme: 'Nouveau terme', groupe: g, definition: '', detrompeurs: ['', '', ''], voisins: [], vrai_faux: [], situations: [], trous: [] };
    data.termes.push(t); courant = t.id; marquer(); dessinerNav(); dessinerFiche();
  }

  /* ---------- enregistrement ---------- */
  function nettoyer() {
    // copie sans entrées vides inutiles, en gardant l'ordre habituel des clés
    var copie = JSON.parse(JSON.stringify(data));
    copie.termes.forEach(function (t) {
      t.detrompeurs = (t.detrompeurs || []).filter(function (x) { return x && x.trim(); });
      t.situations = (t.situations || []).filter(function (x) { return x && x.trim(); });
      t.vrai_faux = (t.vrai_faux || []).filter(function (x) { return x.enonce && x.enonce.trim(); });
      t.trous = (t.trous || []).filter(function (x) { return x.texte && x.texte.trim(); });
      if (!t.voisins) t.voisins = [];
    });
    return JSON.stringify(copie, null, 2) + '\n';
  }
  function marquerEnregistre() {
    modifie = false; var s = $('etat'); s.textContent = 'Enregistré'; s.className = 'ok';
  }
  async function enregistrer() {
    var pb = verifier();
    if (pb.length && !confirm(pb.length + ' problème(s) détecté(s) (voir la liste en haut). Enregistrer quand même ?')) return;
    var texte = nettoyer();
    // 1) écriture directe dans le fichier d'origine si le navigateur le permet
    if (window.showSaveFilePicker) {
      try {
        if (!handle) handle = await window.showSaveFilePicker({ suggestedName: NOM_JSON, types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }] });
        var w = await handle.createWritable(); await w.write(texte); await w.close();
        marquerEnregistre(); return;
      } catch (e) { if (e && e.name === 'AbortError') return; handle = null; }
    }
    // 2) sinon : téléchargement, sous le nom attendu par l'exercice
    var blob = new Blob([texte], { type: 'application/json' });
    var a = el('a', { href: URL.createObjectURL(blob), download: NOM_JSON });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    marquerEnregistre();
    alert('Le fichier « ' + NOM_JSON + ' » a été téléchargé. Remplace l\'ancien dans le dossier de l\'exercice (même nom, même dossier).');
  }

  /* ---------- démarrage ---------- */
  function demarrerAvec(obj) {
    if (!obj || !Array.isArray(obj.termes)) throw new Error('Format inattendu : la clé « termes » est absente.');
    data = obj;
    data.groupes = Array.isArray(data.groupes) ? data.groupes : [];
    $('manuel').hidden = true;
    $('accueil').hidden = true;
    $('haut').hidden = false; $('mise').hidden = false;
    $('titre-page').textContent = 'Éditeur — ' + NOM_JSON;
    document.title = 'Éditeur — ' + NOM_JSON;
    courant = 'general';
    dessinerNav(); dessinerFiche(); verifierEtMontrer();
  }
  function afficherManuel(raison) {
    $('accueil-msg').textContent = 'Fichier de données non chargé.';
    $('manuel').hidden = false;
    $('manuel-nom').textContent = NOM_JSON;
    $('manuel-raison').textContent = raison || '';
  }

  $('b-enregistrer').addEventListener('click', enregistrer);
  $('manuel-fichier').addEventListener('change', function (ev) {
    var fichier = ev.target.files && ev.target.files[0]; if (!fichier) return;
    var lecteur = new FileReader();
    lecteur.onload = function () {
      try { demarrerAvec(JSON.parse(lecteur.result)); }
      catch (e) { $('manuel-raison').textContent = 'Ce fichier est illisible : ' + e.message; }
    };
    lecteur.readAsText(fichier);
  });
  window.addEventListener('beforeunload', function (e) { if (modifie) { e.preventDefault(); e.returnValue = ''; } });

  if (!RACINE) { $('accueil-msg').textContent = 'Ouvre cette page par son nom de fichier.'; return; }
  fetch(NOM_JSON, { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(demarrerAvec)
    .catch(function (e) { afficherManuel('Raison : ' + e.message); });
})();
</script>
</body>
</html>
