<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vocabulaire – entraînement</title>
<!-- Principe des noms : cette page « nom.html » charge « nom.js », qui charge « nom.json ». -->
<style>
:root{
  --ink:#1b2a3a; --muted:#5b6978; --line:#cdd6e0; --bg:#eef2f6; --paper:#fff;
  --blue:#1a5da8; --blue-dark:#134a87; --soft:#dde9f6;
  --ok:#1d7a3b; --okbg:#e3f4e8; --ko:#b3261e; --kobg:#fce6e4; --gold:#9a6b00;
  --font:Verdana,"Segoe UI",Tahoma,Arial,sans-serif; --mono:"Consolas","Menlo","DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
header.top{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding:.9rem 1.25rem;background:var(--paper);border-bottom:4px solid var(--blue)}
header.top h1{margin:0;font-size:1.3rem;color:var(--blue)}
header.top p{margin:0;color:var(--muted)}
header.top .tools{margin-left:auto;display:flex;gap:.5rem}
main{max-width:1200px;margin:0 auto;padding:1rem 1rem 3rem}
h2{font-size:1.1rem;margin:0 0 .7rem} h2.mt{margin-top:1.4rem} h3{font-size:1rem;margin:1rem 0 .4rem}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:1rem 1.1rem;margin-bottom:1rem}
.hint{color:var(--muted);font-size:.9rem;margin:.3rem 0 .6rem} .center{text-align:center}
.warn{color:var(--ko);font-weight:bold}
.num{display:inline-grid;place-items:center;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--blue);color:#fff;font-size:.9rem;margin-right:.4rem}
.badge{background:var(--soft);color:var(--blue);border-radius:10px;padding:0 .5rem;font-size:.9rem}
.head-row{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:.7rem}
.row input[type=number]{width:4.5rem}
input[type=number],select{border:1px solid var(--line);border-radius:5px;padding:.35rem .5rem;background:#fff}
select{max-width:100%}
.bar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-top:.8rem} .bar.center{justify-content:center}

.btn{border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:5px;padding:.45rem .9rem;cursor:pointer}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--blue);color:#fff;font-weight:bold} .btn.primary:hover{background:var(--blue-dark)}
.btn.small{padding:.25rem .6rem;font-size:.9rem}
.btn.danger{border-color:var(--ko);color:var(--ko)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:none;color:var(--blue);text-decoration:underline;cursor:pointer;padding:0 .2rem;font-size:.9rem}
kbd{font-family:var(--mono);font-size:.8rem;border:1px solid currentColor;border-radius:3px;padding:0 .3rem;opacity:.75}

/* Accueil */
.home{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem;max-width:900px;margin:1.5rem auto}
@media (max-width:640px){.home{grid-template-columns:1fr}}
.htile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:.35rem;text-align:left;min-height:9rem;padding:1.1rem 1.2rem;border:1px solid var(--hbd);border-left:8px solid var(--hdk);border-radius:12px;background:var(--hbg);color:var(--ink);cursor:pointer}
.htile strong{font-size:1.15rem;color:var(--hdk)}
.htile .hicon{font-size:1.6rem;line-height:1;color:var(--hdk)}
.htile .hdesc{color:#3c4856;font-size:.92rem}
button.htile:hover:not(:disabled),.h-import .hmain:hover{box-shadow:0 0 0 2px var(--hdk)}
.htile:disabled{opacity:.5;cursor:not-allowed}
.h-resume{--hbg:#e3f5e6;--hbd:#9fd3aa;--hdk:#1d6b34}
.h-same{--hbg:#efe6fa;--hbd:#c2a8e6;--hdk:#5b3a91}
.h-new{--hbg:#fff8d6;--hbd:#e8cf6a;--hdk:#7a5f00}
.h-import{--hbg:#ffeedd;--hbd:#f2bb85;--hdk:#8f450a;padding:0;cursor:default}
.h-import .hmain{all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:flex-start;gap:.35rem;width:100%;height:100%;padding:1.1rem 3.2rem 1.1rem 1.2rem;border-radius:0 11px 11px 0;cursor:pointer}
.h-import .hmain:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.hinfo{position:absolute;top:.7rem;right:.7rem;width:1.9rem;height:1.9rem;border-radius:50%;border:2px solid var(--hdk);background:#fff;color:var(--hdk);font:italic bold 1rem Georgia,serif;cursor:pointer}
.hinfo:hover{background:var(--hdk);color:#fff}

/* Sélection */
.grid-select{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:1rem;align-items:start}
@media (max-width:860px){.grid-select{grid-template-columns:1fr}}
.grid-select>.panel,.side>.panel{margin-bottom:1rem}
.side-title{font-size:.95rem;font-weight:normal;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:.3rem 0 .5rem .2rem}
.panel.quiet{background:transparent;border:1px dashed var(--line);padding:.8rem .9rem;font-size:.92rem}
.draw h3{font-size:.95rem;font-weight:bold;margin:0 0 .5rem;display:flex;align-items:center;gap:.1rem}
.draw+.draw{border-top:1px solid var(--line);margin-top:.9rem;padding-top:.9rem}
.draw .row{margin-bottom:.5rem}
.draw input[type=number],.draw select{padding:.25rem .4rem;font-size:.92rem}
.num.sm{width:1.3rem;height:1.3rem;font-size:.75rem;background:var(--muted)}
.wordlist{max-height:62vh;overflow:auto;border-top:1px solid var(--line);padding-right:.2rem}
.group h3{position:sticky;top:0;background:var(--paper);padding:.5rem 0 .3rem;margin:0;display:flex;align-items:baseline;gap:.5rem;z-index:1}
.grp{margin-left:auto}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.6rem}
.chip{display:inline-flex;flex-direction:column;align-items:flex-start;text-align:left;border:1px solid var(--cbd,var(--line));border-radius:6px;background:var(--cbg,#fff);padding:.3rem .55rem;cursor:pointer;position:relative;max-width:100%}
.chip .t{font-weight:bold} .chip .f{font-size:.8rem}
.chip .f{color:#173a6b;align-self:stretch;text-align:right}
.chip:hover{border-color:var(--cdk,var(--blue))}
.chip.on{background:var(--con,var(--soft));border-color:var(--cdk,var(--blue));box-shadow:inset 0 0 0 2px var(--cdk,var(--blue))}
.chip.on .t::before{content:"✔ ";color:var(--cdk,var(--blue))}
.group h3 .catdot{display:inline-block;width:.85rem;height:.85rem;border-radius:3px;background:var(--con);border:1px solid var(--cdk);flex:none}
.group h3{color:var(--cdk,var(--ink))}
.chip.known{opacity:.6} .chip.known.on{opacity:.8}
.chip .ok{position:absolute;top:.15rem;right:.3rem;color:var(--ok);font-weight:bold}
.chip.known{padding-right:1.4rem}
.chip.static{cursor:default}
.chips.small .chip{padding:.2rem .45rem}
.known-list{display:flex;flex-wrap:wrap;gap:.35rem}
.kchip{display:inline-flex;align-items:center;gap:.2rem;background:var(--okbg);border:1px solid #b9dcc4;border-radius:14px;padding:.1rem .2rem .1rem .6rem;font-size:.9rem}
.kchip .x{border:none;background:none;cursor:pointer;color:var(--muted);font-size:1.1rem;line-height:1;padding:0 .3rem}
.kchip .x:hover{color:var(--ko)}

/* Parcours et modes */
.parcours{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.6rem}
.pc{display:grid;grid-template-columns:auto 1fr;gap:.1rem .5rem;border:1px solid var(--line);border-radius:8px;padding:.6rem .7rem;cursor:pointer}
.pc input{grid-row:span 2;margin-top:.25rem} .pc span{color:var(--muted);font-size:.88rem}
.pc.on{border-color:var(--blue);background:var(--soft)}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.6rem}
/* Couleur de chaque mode d'apprentissage */
.m-1{--mc:#0b6e6c;--mbg:#e5f4f3}   .m-2{--mc:#1a5da8;--mbg:#e6eff9}
.m-3{--mc:#3d47a8;--mbg:#eaebf8}   .m-3bis{--mc:#7a3a9e;--mbg:#f3eaf8}
.m-4{--mc:#b24c08;--mbg:#fcefe4}   .m-5{--mc:#866000;--mbg:#faf3dc}
.m-6{--mc:#1d7a3b;--mbg:#e5f4ea}   .m-7{--mc:#ad2a4e;--mbg:#fbe8ee}
.mode{display:grid;grid-template-columns:auto 1fr;gap:.15rem .6rem;text-align:left;border:1px solid var(--line);border-radius:8px;background:#fff;padding:.7rem .8rem;cursor:pointer}
.mode{border-left:6px solid var(--mc,var(--blue));background:var(--mbg,#fff)}
.mode .mcount{color:var(--mc,var(--blue))!important}
.mode:hover:not(:disabled){border-color:var(--mc,var(--blue));box-shadow:0 0 0 1px var(--mc,var(--blue));background:var(--mbg,#f6f9fd)}
.mode .mnum{grid-row:span 4;display:grid;place-items:center;min-width:2.2rem;height:2.2rem;border-radius:6px;background:var(--mc,var(--blue));color:#fff;font-weight:bold;font-size:.85rem;padding:0 .3rem}
.mode .mdesc{font-size:.85rem;color:var(--muted)} .mode .mcount{font-size:.8rem;color:var(--blue)}
.mode .rec{font-size:.8rem;color:var(--gold)}
.mode:disabled{opacity:.5;cursor:not-allowed;border-left-color:var(--muted);background:#fff} .mode:disabled .mnum{background:var(--muted)}
.game .hud{border-top:5px solid var(--mc,var(--blue))} .game .hmode{color:var(--mc,var(--blue))}
.game .card{border-top:5px solid var(--mc,var(--blue))}

/* Jeu */
.game{max-width:760px;margin:0 auto}
.hud{display:flex;flex-wrap:wrap;gap:.4rem 1rem;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:.55rem .8rem;margin-bottom:.8rem;font-size:.92rem}
.hmode{font-weight:bold;color:var(--blue)} .hmain{font-weight:bold}
.htime{font-family:var(--mono)} .htime.urgent{color:var(--ko);font-weight:bold}
.hleft{color:var(--muted)} .hud .btn{margin-left:auto}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:1.3rem 1.2rem 1.4rem;text-align:center}
.consigne{color:var(--muted);margin:0 0 .6rem}
.prompt{font-size:1.7rem;font-weight:bold;margin:.2rem 0 1.1rem;overflow-wrap:anywhere}
.options{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;text-align:left}
@media (max-width:560px){.options{grid-template-columns:1fr}.prompt{font-size:1.4rem}}
.opt{display:flex;gap:.6rem;align-items:center;border:2px solid var(--line);border-radius:8px;background:#fff;padding:.7rem .8rem;cursor:pointer;font-size:1.05rem}
.opt:hover:not(:disabled){border-color:var(--blue);background:#f6f9fd}
.opt:disabled{cursor:default}
.opt.good{border-color:var(--ok);background:var(--okbg)} .opt.bad{border-color:var(--ko);background:var(--kobg)}
.opt kbd{flex:none}
.speak{border:none;background:none;cursor:pointer;font-size:1.1rem;padding:0 .2rem;vertical-align:middle}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:.25rem;margin:.4rem 0 .6rem}
.tile{display:inline-grid;place-items:center;width:2.2rem;height:2.7rem;border:1px solid var(--line);border-radius:5px;font-family:var(--mono);font-size:1.4rem;background:#f7f9fb}
input.tile{text-align:center;background:#fff;border:2px solid var(--blue);padding:0}
.gap{width:1rem}
.sylword{font-family:var(--mono);font-size:1.7rem;margin:.4rem 0 .2rem;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;white-space:pre;max-width:100%}
input.syl{font-family:var(--mono);font-size:1.5rem;text-align:center;border:2px solid var(--blue);border-radius:5px;padding:.1rem .2rem;margin:0 .1rem}
.typebox{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap}
#typed{font-size:1.3rem;padding:.45rem .6rem;border:2px solid var(--blue);border-radius:6px;width:min(100%,24rem)}
input.good{border-color:var(--ok)!important;background:var(--okbg)!important} input.bad{border-color:var(--ko)!important;background:var(--kobg)!important}
#feedback{min-height:4rem;margin-top:.8rem}
.fb{border-radius:8px;padding:.7rem .9rem;display:flex;flex-wrap:wrap;gap:.4rem .6rem;align-items:center;justify-content:center;font-size:1.05rem}
.fb.ok{background:var(--okbg);color:var(--ok)} .fb.ko{background:var(--kobg);color:var(--ko)}
.fb strong{color:var(--ink)} .fb .btn{margin-left:.4rem}
mark{background:#ffe38a;color:inherit;border-radius:2px;padding:0 1px}
.autobar{flex-basis:100%;height:4px;background:rgba(29,122,59,.15);border-radius:2px;overflow:hidden}
.autobar span{display:block;height:100%;background:var(--ok);transform-origin:left;animation:autobar linear forwards}
@keyframes autobar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){.autobar span{animation:none}}
.sumsg{flex-basis:100%;text-align:center;font-weight:bold;color:var(--ok)} .sumsg.back{color:var(--ko)}

/* Fin */
.end .big{font-size:1.25rem;font-weight:bold;margin:.3rem 0}
.record{color:var(--gold);font-weight:bold}

/* Chargement, réglages, messages */
.loader{max-width:640px;margin:2rem auto}
.drop{display:grid;place-items:center;gap:.5rem;border:2px dashed var(--blue);border-radius:10px;padding:1.6rem;cursor:pointer;background:#f6f9fd;text-align:center}
.drop.over{background:var(--soft)}
dialog{border:none;border-radius:10px;padding:0;max-width:min(94vw,640px);width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(27,42,58,.45)}
.settings{padding:1.2rem 1.3rem;display:grid;grid-template-columns:minmax(0,1fr);gap:.6rem}
.settings>*{min-width:0}
.settings label{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.settings label.check{justify-content:flex-start}
.settings input[type=number]{width:5rem}
.settings hr{border:none;border-top:1px solid var(--line);width:100%}
dialog{max-height:92vh;overflow-y:auto;overflow-x:hidden}
.settings h3{margin:.2rem 0 0}
.settings label.filebtn{display:inline-block}
.doc{border:1px solid var(--line);border-radius:6px;padding:.4rem .7rem}
.doc summary{cursor:pointer;font-weight:bold;color:var(--blue)}
.doc p,.doc ol{font-size:.88rem;margin:.5rem 0}
.doc pre{font-family:var(--mono);font-size:.78rem;background:#f4f6f9;border-radius:5px;padding:.5rem;overflow-x:auto;white-space:pre;max-width:100%}
.doc code{font-family:var(--mono);background:#f4f6f9;padding:0 .2rem;border-radius:3px}
.doc textarea{width:100%;font-family:var(--mono);font-size:.78rem;border:1px solid var(--line);border-radius:5px;padding:.5rem;resize:vertical}
#toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,150%);background:var(--ink);color:#fff;padding:.6rem 1rem;border-radius:8px;max-width:90vw;transition:transform .25s;z-index:10}
#toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header class="top">
  <h1 id="title">Vocabulaire</h1>
  <p id="subtitle"></p>
  <div class="tools">
    <input type="file" id="headerImport" accept=".json,application/json" hidden>
    <button class="btn small" id="btnHome">🏠 Accueil</button>
    <button class="btn small" id="btnSettings">⚙ Réglages</button>
  </div>
</header>
<main id="app">
  <section class="panel loader" id="boot">
    <p>Chargement…</p>
  </section>
</main>
<script>
/* Charge le moteur de jeu portant le même nom que cette page (nom.html → nom.js). */
(function () {
  var file = decodeURIComponent(location.pathname.split("/").pop() || "");
  var base = file.split(".")[0] || "index";   // racine = nom avant le premier point
  window.APP_BASE = base;
  var s = document.createElement("script");
  s.src = encodeURIComponent(base) + ".js";
  s.onerror = function () {
    document.getElementById("boot").innerHTML =
      "<h2>Fichier manquant</h2><p>Cette page a besoin du fichier <strong>" +
      base.replace(/[<>&]/g, "") + ".js</strong>, placé dans le même dossier qu'elle.</p>" +
      "<p>Les trois fichiers doivent porter le même nom : <strong>" + base.replace(/[<>&]/g, "") +
      ".html</strong>, <strong>.js</strong> et <strong>.json</strong>.</p>";
  };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
