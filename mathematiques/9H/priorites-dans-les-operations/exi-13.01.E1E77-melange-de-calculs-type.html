<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choisis le calcul avec les parenthèses</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --text: #1f2937; --muted: #6b7280;
      --border: #d1d5db; --accent: #2563eb; --ok: #15803d; --bad: #b91c1c;
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family:Arial,Helvetica,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:24px; }
    .page { width:min(760px,100%); margin:0 auto; }
    .back { display:inline-block; margin-bottom:14px; color:var(--accent); text-decoration:none; font-weight:700; }
    .back:hover { text-decoration:underline; }
    h1 { margin:0 0 18px; text-align:center; font-size:clamp(1.6rem,5vw,2.3rem); }
    .app { width:100%; background:var(--card); border:1px solid var(--border); border-radius:18px; padding:24px; }
    .topbar { display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; align-items:center; margin-bottom:18px; }
    .instruction { color:var(--muted); font-size:.95rem; }
    .score { display:flex; gap:18px; font-size:.95rem; }
    .expression { text-align:center; font-size:clamp(2rem,6vw,3.3rem); font-weight:700; margin:34px 0; letter-spacing:.02em; }
    form { display:flex; gap:10px; max-width:430px; margin:0 auto; }
    input { flex:1; min-width:0; font-size:1.4rem; text-align:center; padding:14px 16px; border:1px solid var(--border); border-radius:12px; outline:none; }
    input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(37,99,235,.15); }
    button { border:none; border-radius:12px; padding:12px 18px; font-size:1rem; font-weight:700; cursor:pointer; }
    button:disabled { cursor:default; opacity:.5; }
    .validate { background:var(--accent); color:#fff; }
    .next { display:block; margin:10px auto 0; background:#eef2ff; color:var(--text); border:1px solid var(--border); }
    .feedback { min-height:46px; text-align:center; margin:16px 0 6px; font-weight:700; }
    .feedback.ok { color:var(--ok); } .feedback.bad { color:var(--bad); }
    .note { margin-top:22px; text-align:center; color:var(--muted); font-size:.9rem; line-height:1.5; }
    @media (max-width:520px) { body{padding:12px}.app{padding:18px}form{flex-direction:column}button{width:100%} }
  </style>
</head>
<body>
  <div class="page">
    <a class="back" href="index.html">← Retour à Priorités dans les opérations</a>
    <h1>Choisis le calcul avec les parenthèses</h1>
    <main class="app">
      <div class="topbar">
        <div class="instruction">Calcule le résultat et entre seulement le nombre.</div>
        <div class="score"><span>✓ <strong id="good">0</strong></span><span>✗ <strong id="bad">0</strong></span></div>
      </div>
      <div id="expression" class="expression">5 × 6 + 8</div>
      <form id="answerForm">
        <input id="answer" type="text" inputmode="decimal" autocomplete="off" aria-label="Résultat du calcul" />
        <button class="validate" type="submit">Valider</button>
      </form>
      <div id="feedback" class="feedback" aria-live="polite"></div>
      <button id="nextBtn" class="next" type="button" disabled>Question suivante</button>
      <div class="note">Trois types de calculs sont mélangés :<br>a × b ± c &nbsp;•&nbsp; a × (b ± c) &nbsp;•&nbsp; a × (b ± nombre décimal)</div>
    </main>
  </div>
  <script>
    (() => {
      const expressionEl=document.getElementById('expression'), answerInput=document.getElementById('answer'),
      answerForm=document.getElementById('answerForm'), feedbackEl=document.getElementById('feedback'),
      nextBtn=document.getElementById('nextBtn'), goodEl=document.getElementById('good'), badEl=document.getElementById('bad');
      let good=0,bad=0,currentAnswer=0,locked=false;
      const rnd=(min,max)=>Math.floor(Math.random()*(max-min+1))+min;
      const pick=arr=>arr[rnd(0,arr.length-1)];
      const fmt=n=>String(Number(n.toFixed(4))).replace('.', ',');
      function newQuestion(){
        locked=false; answerInput.disabled=false; answerInput.value=''; feedbackEl.textContent=''; feedbackEl.className='feedback'; nextBtn.disabled=true;
        const type=rnd(1,3), a=rnd(2,9); let text='',result=0;
        if(type===1){ const b=rnd(2,12),c=rnd(1,20),op=pick(['+','−']); result=op==='+'?a*b+c:a*b-c; text=`${a} × ${b} ${op} ${c}`; }
        if(type===2){ const b=rnd(2,12),c=rnd(1,8),op=pick(['+','−']); if(op==='−'&&b-c<0){result=a*(b+c);text=`${a} × (${b} + ${c})`;} else {const inside=op==='+'?b+c:b-c;result=a*inside;text=`${a} × (${b} ${op} ${c})`;} }
        if(type===3){ const b=pick([5,10,20,25,50]),c=pick([0.01,0.05,0.1,0.2,0.5]),op=pick(['+','−']),inside=op==='+'?b+c:b-c; result=a*inside; text=`${a} × (${b} ${op} ${fmt(c)})`; }
        currentAnswer=Number(result.toFixed(6)); expressionEl.textContent=text; answerInput.focus();
      }
      function parseNumber(value){ return Number(value.trim().replace(',', '.')); }
      answerForm.addEventListener('submit',event=>{
        event.preventDefault(); if(locked)return;
        const value=parseNumber(answerInput.value);
        if(!Number.isFinite(value)){ feedbackEl.textContent='Entre un nombre.'; feedbackEl.className='feedback bad'; return; }
        locked=true; answerInput.disabled=true; nextBtn.disabled=false;
        if(Math.abs(value-currentAnswer)<0.000001){good++;goodEl.textContent=good;feedbackEl.textContent='Correct.';feedbackEl.className='feedback ok';}
        else{bad++;badEl.textContent=bad;feedbackEl.textContent=`Incorrect. Le résultat est ${fmt(currentAnswer)}.`;feedbackEl.className='feedback bad';}
        nextBtn.focus();
      });
      nextBtn.addEventListener('click',newQuestion);
      document.addEventListener('keydown',event=>{ if(event.code==='Space'&&!nextBtn.disabled&&document.activeElement!==answerInput){event.preventDefault();newQuestion();} });
      newQuestion();
    })();
  </script>
</body>
</html>
