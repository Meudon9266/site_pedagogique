<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulaire des opérations — Phrases et expressions</title>
<style>
:root{
  --bg:#f4f7fb; --card:#fff; --text:#152238; --muted:#667085;
  --blue:#2563eb; --blue2:#dbeafe; --green:#15803d; --greenbg:#dcfce7;
  --red:#b91c1c; --redbg:#fee2e2; --border:#d0d5dd; --yellow:#fff1bf;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
.wrap{max-width:1000px;margin:24px auto;padding:18px}
h1{margin:0 0 6px;font-size:32px}
.subtitle{color:var(--muted)}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.tab{
  border:2px solid #cbd5e1;background:#fff;border-radius:12px;
  padding:10px 18px;font-size:16px;font-weight:700;cursor:pointer
}
.tab.active{background:var(--blue);border-color:var(--blue);color:#fff}
.card{
  background:#fff;border-radius:18px;padding:22px;
  box-shadow:0 6px 20px rgba(0,0,0,.07);margin-top:16px
}
.status{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.levelTitle{font-size:24px;font-weight:700}
.desc{color:var(--muted);margin-top:4px}
.counter{background:#eef2ff;border-radius:999px;padding:9px 13px;font-weight:700}
.progress{display:flex;gap:7px;margin-top:10px}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid #94a3b8;background:#fff}
.dot.on{background:var(--blue);border-color:var(--blue)}
.promptLabel{text-align:center;color:var(--muted);font-size:18px}
.prompt{
  text-align:center;font-size:30px;font-weight:700;
  padding:28px 12px 24px;line-height:1.35
}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{
  min-height:78px;border:2px solid var(--border);background:#fff;
  border-radius:15px;padding:14px 16px;text-align:left;
  font-size:19px;cursor:pointer;color:#111827;line-height:1.35
}
.choice:hover{background:#f8fafc;border-color:#94a3b8}
.choice.selected{background:var(--blue2);border-color:var(--blue)}
.choice.correct{background:var(--greenbg);border-color:var(--green)}
.choice.wrong{background:var(--redbg);border-color:var(--red)}
.num{
  display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:10px;background:#eef2f7;
  margin-right:10px;font-weight:700
}
.feedback{
  margin-top:18px;padding:15px;border-radius:13px;
  min-height:54px;text-align:center;font-size:19px
}
.feedback:empty{display:none}
.feedback.ok{background:var(--greenbg);color:#166534}
.feedback.bad{background:var(--redbg);color:#991b1b}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.btn{
  border:0;border-radius:12px;padding:12px 18px;
  font-size:17px;font-weight:700;cursor:pointer
}
.primary{background:var(--blue);color:#fff}
.dark{background:#111827;color:#fff}
.gray{background:#e5e7eb}
.yellow{background:var(--yellow);color:#8a4b00}
.hidden{display:none!important}
.settingsGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.settingsGrid input{width:100%;padding:9px;border:1px solid var(--border);border-radius:8px;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#f8fafc;border-radius:12px;padding:12px}
.small{font-size:13px;color:var(--muted)}
.big{font-size:25px;font-weight:700}
@media(max-width:720px){
  .choices{grid-template-columns:1fr}
  .stats,.settingsGrid{grid-template-columns:1fr}
  .prompt{font-size:25px}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Vocabulaire des opérations</h1>
  <div class="subtitle">Phrases ↔ expressions mathématiques</div>

  <div class="tabs">
    <button class="tab active" id="tab1">Niveau 1 — Phrase → Calcul</button>
    <button class="tab" id="tab2">Niveau 2 — Calcul → Phrase</button>
  </div>

  <div class="card status">
    <div>
      <div class="levelTitle" id="levelTitle"></div>
      <div class="desc" id="levelDesc"></div>
      <div class="progress" id="progress"></div>
    </div>
    <div class="counter" id="counter"></div>
  </div>

  <div class="card">
    <div class="promptLabel" id="promptLabel"></div>
    <div class="prompt" id="prompt"></div>
    <div class="choices" id="choices"></div>

    <div class="feedback" id="feedback"></div>

    <div class="controls">
      <button class="btn primary" id="validateBtn">Valider — Entrée</button>
      <button class="btn dark hidden" id="nextBtn">Question suivante — Espace</button>
      <button class="btn yellow" id="settingsBtn">Paramètres</button>
      <button class="btn gray" id="restartBtn">Recommencer</button>
    </div>
  </div>

  <div class="card hidden" id="settingsPanel">
    <h2>Paramètres</h2>
    <div class="settingsGrid">
      <label>
        Réussites consécutives niveau 1
        <input type="number" id="th1" min="1" max="20" value="5">
      </label>
      <label>
        Réussites consécutives niveau 2
        <input type="number" id="th2" min="1" max="20" value="5">
      </label>
    </div>
    <div class="controls">
      <button class="btn primary" id="saveSettings">Enregistrer</button>
      <button class="btn gray" id="closeSettings">Fermer</button>
    </div>
  </div>

  <div class="card">
    <h2>Suivi</h2>
    <div class="stats">
      <div class="stat"><div class="small">Bonnes réponses</div><div class="big" id="goodCount">0</div></div>
      <div class="stat"><div class="small">Erreurs</div><div class="big" id="errorCount">0</div></div>
      <div class="stat"><div class="small">Meilleure série</div><div class="big" id="bestStreak">0</div></div>
    </div>
  </div>
</div>

<script>
"use strict";

const QUESTIONS = {
  1: [
    {
      prompt:"La somme de 25 et 4.",
      choices:["25 + 4","25 × 4","25 − 4","4 − 25"],
      correct:"25 + 4"
    },
    {
      prompt:"Le produit de 24 par 4.",
      choices:["24 + 4","24 × 4","24 ÷ 4","4 ÷ 24"],
      correct:"24 × 4"
    },
    {
      prompt:"Le quotient de la différence de 10 et de 6 par 2.",
      choices:["(10 − 6) ÷ 2","10 − (6 ÷ 2)","2 ÷ (10 − 6)","(6 − 10) ÷ 2"],
      correct:"(10 − 6) ÷ 2"
    },
    {
      prompt:"La somme de 18 et du produit de 9 par 2.",
      choices:["18 + (9 × 2)","(18 + 9) × 2","(18 × 9) + 2","18 × (9 + 2)"],
      correct:"18 + (9 × 2)"
    },
    {
      prompt:"La différence entre 40 et le produit de 6 par 5.",
      choices:["40 − (6 × 5)","(40 − 6) × 5","(6 × 5) − 40","40 × (6 − 5)"],
      correct:"40 − (6 × 5)"
    },
    {
      prompt:"Le produit de 7 par la somme de 3 et 8.",
      choices:["7 × (3 + 8)","(7 × 3) + 8","7 + (3 × 8)","(7 + 3) × 8"],
      correct:"7 × (3 + 8)"
    },
    {
      prompt:"Le quotient de 36 par la somme de 4 et 2.",
      choices:["36 ÷ (4 + 2)","(36 ÷ 4) + 2","(4 + 2) ÷ 36","36 + (4 ÷ 2)"],
      correct:"36 ÷ (4 + 2)"
    },
    {
      prompt:"La somme du quotient de 24 par 6 et de 7.",
      choices:["(24 ÷ 6) + 7","24 ÷ (6 + 7)","24 + (6 ÷ 7)","7 ÷ (24 + 6)"],
      correct:"(24 ÷ 6) + 7"
    }
  ],
  2: [
    {
      prompt:"150 ÷ 30",
      choices:[
        "Le quotient de 150 par 30.",
        "Le quotient de 30 par 150.",
        "La différence entre 150 et 30.",
        "Le produit de 150 par 30."
      ],
      correct:"Le quotient de 150 par 30."
    },
    {
      prompt:"35 ÷ 7 − 3",
      choices:[
        "La différence entre le quotient de 35 par 7 et 3.",
        "Le quotient de 35 par la différence entre 7 et 3.",
        "La différence entre 35 et le quotient de 7 par 3.",
        "Le quotient de la différence entre 35 et 7 par 3."
      ],
      correct:"La différence entre le quotient de 35 par 7 et 3."
    },
    {
      prompt:"120 + (30 × 40)",
      choices:[
        "La somme de 120 et du produit de 30 par 40.",
        "Le produit de la somme de 120 et 30 par 40.",
        "La somme du produit de 120 par 30 et de 40.",
        "Le produit de 120 par la somme de 30 et 40."
      ],
      correct:"La somme de 120 et du produit de 30 par 40."
    },
    {
      prompt:"2 × 5 + 4 × 6",
      choices:[
        "La somme du produit de 2 par 5 et du produit de 4 par 6.",
        "Le produit de la somme de 2 et 5 par la somme de 4 et 6.",
        "Le produit de 2 par la somme de 5 et du produit de 4 par 6.",
        "La somme de 2 et du produit de 5 par la somme de 4 et 6."
      ],
      correct:"La somme du produit de 2 par 5 et du produit de 4 par 6."
    },
    {
      prompt:"40 − (6 × 5)",
      choices:[
        "La différence entre 40 et le produit de 6 par 5.",
        "Le produit de la différence entre 40 et 6 par 5.",
        "La différence entre le produit de 6 par 5 et 40.",
        "Le produit de 40 par la différence entre 6 et 5."
      ],
      correct:"La différence entre 40 et le produit de 6 par 5."
    },
    {
      prompt:"7 × (3 + 8)",
      choices:[
        "Le produit de 7 par la somme de 3 et 8.",
        "La somme du produit de 7 par 3 et de 8.",
        "La somme de 7 et du produit de 3 par 8.",
        "Le produit de la somme de 7 et 3 par 8."
      ],
      correct:"Le produit de 7 par la somme de 3 et 8."
    },
    {
      prompt:"36 ÷ (4 + 2)",
      choices:[
        "Le quotient de 36 par la somme de 4 et 2.",
        "La somme du quotient de 36 par 4 et de 2.",
        "Le quotient de la somme de 4 et 2 par 36.",
        "La somme de 36 et du quotient de 4 par 2."
      ],
      correct:"Le quotient de 36 par la somme de 4 et 2."
    },
    {
      prompt:"(24 ÷ 6) + 7",
      choices:[
        "La somme du quotient de 24 par 6 et de 7.",
        "Le quotient de 24 par la somme de 6 et 7.",
        "La somme de 24 et du quotient de 6 par 7.",
        "Le quotient de la somme de 24 et 6 par 7."
      ],
      correct:"La somme du quotient de 24 par 6 et de 7."
    }
  ]
};

const DESCRIPTIONS = {
  1:"Choisir l'expression mathématique qui correspond exactement à la phrase.",
  2:"Choisir la phrase qui décrit exactement l'expression mathématique."
};

const $ = id => document.getElementById(id);

let thresholds = JSON.parse(localStorage.getItem("vo_pf_thresholds") || "null") || {1:5,2:5};

let state = {
  level:1,
  streak:0,
  selected:-1,
  answered:false,
  question:null,
  good:Number(localStorage.getItem("vo_pf_good") || 0),
  errors:Number(localStorage.getItem("vo_pf_errors") || 0),
  best:Number(localStorage.getItem("vo_pf_best") || 0),
  questionIndex:{1:0,2:0}
};

function shuffle(array){
  const a=[...array];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function getQuestion(){
  const bank=QUESTIONS[state.level];
  const index=state.questionIndex[state.level] % bank.length;
  const q=bank[index];

  // Les QUESTIONS sont présentées dans l'ordre défini dans le fichier.
  // Seules les 4 propositions sont mélangées.
  const shuffled=shuffle(q.choices.map(text=>({text,ok:text===q.correct})));

  return {
    prompt:q.prompt,
    choices:shuffled,
    number:index+1,
    total:bank.length
  };
}

function renderTabs(){
  $("tab1").classList.toggle("active",state.level===1);
  $("tab2").classList.toggle("active",state.level===2);
}

function renderProgress(){
  $("levelTitle").textContent=`Niveau ${state.level}`;
  $("levelDesc").textContent=DESCRIPTIONS[state.level];
  $("counter").textContent=`${state.streak} / ${thresholds[state.level]}`;
  $("progress").innerHTML="";
  for(let i=0;i<thresholds[state.level];i++){
    const d=document.createElement("div");
    d.className="dot"+(i<state.streak?" on":"");
    $("progress").appendChild(d);
  }
  $("goodCount").textContent=state.good;
  $("errorCount").textContent=state.errors;
  $("bestStreak").textContent=state.best;
  renderTabs();
}

function renderQuestion(){
  state.question=getQuestion();
  state.selected=-1;
  state.answered=false;

  $("promptLabel").textContent =
    `Question ${state.question.number} / ${state.question.total} — ` +
    (state.level===1
      ? "Quelle expression correspond à cette phrase ?"
      : "Quelle phrase correspond à cette expression ?");
  $("prompt").textContent=state.question.prompt;

  $("choices").innerHTML="";
  state.question.choices.forEach((c,i)=>{
    const b=document.createElement("button");
    b.type="button";
    b.className="choice";
    b.innerHTML=`<span class="num">${i+1}</span>${c.text}`;
    b.addEventListener("click",()=>selectChoice(i));
    $("choices").appendChild(b);
  });

  $("feedback").className="feedback";
  $("feedback").textContent="";
  $("validateBtn").classList.remove("hidden");
  $("nextBtn").classList.add("hidden");
  renderProgress();
}

function selectChoice(i){
  if(state.answered) return;
  state.selected=i;
  [...document.querySelectorAll(".choice")].forEach((b,j)=>{
    b.classList.toggle("selected",i===j);
  });
}

function validate(){
  if(state.answered) return;

  if(state.selected<0){
    $("feedback").className="feedback bad";
    $("feedback").textContent="Choisis d'abord une réponse.";
    return;
  }

  state.answered=true;
  const correctIndex=state.question.choices.findIndex(c=>c.ok);
  const buttons=[...document.querySelectorAll(".choice")];
  buttons[correctIndex].classList.add("correct");

  if(state.selected===correctIndex){
    state.good++;
    state.streak++;
    state.best=Math.max(state.best,state.streak);

    $("feedback").className="feedback ok";
    $("feedback").innerHTML="<strong>A+ — Correct !</strong>";
  }else{
    state.errors++;
    state.streak=0;
    buttons[state.selected].classList.add("wrong");

    $("feedback").className="feedback bad";
    $("feedback").innerHTML=
      `<strong>A− — Ce n'est pas la bonne réponse.</strong><br>Réponse correcte : ${state.question.choices[correctIndex].text}`;
  }

  localStorage.setItem("vo_pf_good",state.good);
  localStorage.setItem("vo_pf_errors",state.errors);
  localStorage.setItem("vo_pf_best",state.best);

  if(state.selected===correctIndex && state.streak>=thresholds[state.level]){
    if(state.level===1){
      state.level=2;
      state.streak=0;
      state.questionIndex[2]=0;
      $("feedback").innerHTML += "<br><strong>Passage au niveau 2.</strong>";
    }else{
      state.streak=0;
      $("feedback").innerHTML += "<br><strong>Niveau 2 réussi !</strong>";
    }
  }

  $("validateBtn").classList.add("hidden");
  $("nextBtn").classList.remove("hidden");
  renderProgress();
}

function switchLevel(level){
  state.level=level;
  state.streak=0;
  state.questionIndex[level]=0;
  renderQuestion();
}

$("tab1").addEventListener("click",()=>switchLevel(1));
$("tab2").addEventListener("click",()=>switchLevel(2));
$("validateBtn").addEventListener("click",validate);
$("nextBtn").addEventListener("click",()=>{
  if(state.answered){
    state.questionIndex[state.level] =
      (state.questionIndex[state.level] + 1) % QUESTIONS[state.level].length;
    renderQuestion();
  }
});
$("restartBtn").addEventListener("click",()=>{
  state.level=1;
  state.streak=0;
  state.questionIndex={1:0,2:0};
  renderQuestion();
});

$("settingsBtn").addEventListener("click",()=>{
  $("settingsPanel").classList.toggle("hidden");
});
$("closeSettings").addEventListener("click",()=>{
  $("settingsPanel").classList.add("hidden");
});
$("saveSettings").addEventListener("click",()=>{
  thresholds[1]=Math.max(1,Math.min(20,Number($("th1").value)||5));
  thresholds[2]=Math.max(1,Math.min(20,Number($("th2").value)||5));
  localStorage.setItem("vo_pf_thresholds",JSON.stringify(thresholds));
  state.streak=0;
  $("settingsPanel").classList.add("hidden");
  renderQuestion();
});

document.addEventListener("keydown",e=>{
  if(["1","2","3","4"].includes(e.key) && !state.answered){
    selectChoice(Number(e.key)-1);
  }else if(e.key==="Enter" && !state.answered){
    e.preventDefault();
    validate();
  }else if(e.code==="Space" && state.answered){
    e.preventDefault();
    state.questionIndex[state.level] =
      (state.questionIndex[state.level] + 1) % QUESTIONS[state.level].length;
    renderQuestion();
  }
});

$("th1").value=thresholds[1];
$("th2").value=thresholds[2];

renderQuestion();
</script>
</body>
</html>
