<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le coup de tampon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F6EFE0;
    --paper:#FFFCF5;
    --navy:#22304A;
    --muted:#7A7161;
    --red:#C1372C;
    --red-dark:#8C2620;
    --wood:#C79A5E;
    --wood-dark:#9C6F35;
    --green:#5F9C4B;
    --blue:#3E7FC1;
    --pink:#D96A7C;
    --orange:#E19640;
    --purple:#8E71C7;
    --shadow: 0 10px 24px rgba(34,48,74,0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    font-family:'Nunito',sans-serif;
    color:var(--navy);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:720px;margin:0 auto;padding:0 0 60px;}

  /* Hero */
  .hero{position:relative;width:100%;height:300px;overflow:hidden;}
  .hero img{width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block;}
  .hero::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(34,48,74,0.05) 0%, rgba(20,26,38,0.78) 100%);
  }
  .hero-text{position:absolute;left:0;right:0;bottom:22px;padding:0 24px;text-align:center;}
  .hero-text h1{
    font-family:'Baloo 2',sans-serif;font-weight:700;
    color:#fff;font-size:clamp(26px,6vw,38px);margin:0 0 6px;
    text-shadow:0 2px 10px rgba(0,0,0,0.35);
  }
  .hero-text p{color:#EFE6D3;margin:0;font-size:15px;font-weight:600;}

  /* Progress */
  .progress{display:flex;justify-content:center;gap:10px;padding:20px 20px 4px;flex-wrap:wrap;}
  .dot{
    width:30px;height:30px;border-radius:50%;
    border:2px solid var(--wood);background:var(--paper);
    display:flex;align-items:center;justify-content:center;
    font-family:'Baloo 2',sans-serif;font-size:13px;font-weight:600;color:var(--wood-dark);
    transition:all .25s ease;
  }
  .dot.current{border-color:var(--red);color:var(--red);transform:scale(1.12);}
  .dot.done-ok{background:var(--green);border-color:var(--green);color:#fff;}
  .dot.done-ko{background:var(--red);border-color:var(--red);color:#fff;}

  /* Card */
  .stage{padding:14px 20px 0;}
  .card{
    background:var(--paper);
    border:2px solid var(--wood);
    border-radius:16px;
    padding:26px 24px 24px;
    box-shadow:var(--shadow);
    position:relative;
  }
  .eyebrow{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:10px;}
  .prompt{
    font-family:'Baloo 2',sans-serif;font-weight:600;
    font-size:20px;line-height:1.4;margin:0 0 20px;color:var(--navy);
  }
  .prompt mark{
    background:none;color:inherit;font-weight:700;
    border-bottom:4px solid var(--tag,#333);padding-bottom:1px;
  }

  .options{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:480px){.options{grid-template-columns:1fr;}}
  .opt{
    font-family:'Nunito',sans-serif;font-weight:700;font-size:15.5px;
    background:#fff;border:2px solid #E4D9BF;border-radius:12px;
    padding:14px 14px;cursor:pointer;text-align:left;color:var(--navy);
    transition:border-color .15s, transform .1s, background .15s;
  }
  .opt:hover:not(:disabled){border-color:var(--wood);transform:translateY(-1px);}
  .opt:disabled{cursor:default;}
  .opt.correct{background:#EAF4E4;border-color:var(--green);color:#2F5A24;}
  .opt.incorrect{background:#FBEAE8;border-color:var(--red);color:var(--red-dark);}
  .opt.reveal-correct{background:#EAF4E4;border-color:var(--green);color:#2F5A24;}

  .hint-row{margin-top:16px;}
  .hint-btn{
    background:none;border:none;color:var(--muted);font-weight:700;
    font-size:13.5px;cursor:pointer;padding:4px 0;text-decoration:underline dotted;
  }
  .hint-text{
    font-size:14px;color:var(--muted);margin-top:6px;display:none;
  }
  .hint-text.show{display:block;}

  .feedback{
    margin-top:18px;border-radius:12px;padding:16px 16px 14px;
    display:none;position:relative;
  }
  .feedback.show{display:block;}
  .feedback.ok{background:#EAF4E4;border:2px solid var(--green);}
  .feedback.ko{background:#FBEAE8;border:2px solid var(--red);}
  .feedback-title{
    font-family:'Baloo 2',sans-serif;font-weight:700;font-size:16px;
    display:flex;align-items:center;gap:8px;margin-bottom:6px;
  }
  .feedback.ok .feedback-title{color:#2F5A24;}
  .feedback.ko .feedback-title{color:var(--red-dark);}
  .feedback p{margin:0;font-size:14.5px;line-height:1.55;color:var(--navy);}

  .stamp-mark{
    position:absolute;top:-14px;right:10px;
    width:64px;height:64px;border-radius:50%;
    background:var(--red);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-family:'Baloo 2',sans-serif;font-weight:700;font-size:11.5px;
    letter-spacing:.5px;text-align:center;line-height:1.15;
    border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,0.25);
    transform:rotate(-14deg) scale(0);
    animation:stampIn .35s cubic-bezier(.25,1.4,.5,1) forwards;
  }
  @keyframes stampIn{
    0%{transform:rotate(-14deg) scale(0);}
    70%{transform:rotate(-14deg) scale(1.15);}
    100%{transform:rotate(-14deg) scale(1);}
  }
  @media (prefers-reduced-motion: reduce){
    .stamp-mark{animation:none;transform:rotate(-14deg) scale(1);}
  }

  .next-row{margin-top:22px;display:flex;justify-content:flex-end;}
  .next-btn{
    font-family:'Baloo 2',sans-serif;font-weight:600;font-size:15px;
    background:var(--navy);color:#fff;border:none;border-radius:10px;
    padding:12px 22px;cursor:pointer;opacity:.35;pointer-events:none;
    transition:opacity .2s;
  }
  .next-btn.active{opacity:1;pointer-events:auto;}
  .next-btn:hover.active{background:#17223a;}

  /* End screen */
  .end{display:none;padding:14px 20px 0;text-align:center;}
  .end.show{display:block;}
  .end-card{
    background:var(--paper);border:2px solid var(--wood);border-radius:16px;
    padding:32px 24px;box-shadow:var(--shadow);
  }
  .end-photo{
    width:96px;height:96px;border-radius:50%;object-fit:cover;
    border:3px solid var(--red);margin:0 auto 16px;display:block;
  }
  .score-big{
    font-family:'Baloo 2',sans-serif;font-weight:700;
    font-size:44px;color:var(--red);margin:0;
  }
  .score-label{color:var(--muted);font-weight:700;font-size:14px;margin:2px 0 14px;}
  .end-msg{font-size:15.5px;line-height:1.6;margin:0 0 22px;color:var(--navy);}
  .restart-btn{
    font-family:'Baloo 2',sans-serif;font-weight:600;font-size:15px;
    background:var(--red);color:#fff;border:none;border-radius:10px;
    padding:13px 26px;cursor:pointer;
  }
  .restart-btn:hover{background:var(--red-dark);}

  .legend{
    display:flex;justify-content:center;gap:16px;flex-wrap:wrap;
    padding:22px 20px 0;font-size:12.5px;color:var(--muted);font-weight:700;
  }
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend i{width:14px;height:4px;border-radius:2px;display:inline-block;}
</style>
</head>

    prompt: '« il <mark style="--tag:var(--blue)">mange</mark> » est au présent. Quel temps composé obtient-on en posant le tampon dessus ?',

    correct: 0,
    hint: 'Conjugue avoir au présent, puis ajoute le participe passé.',

    ko: 'Conjugue d\'abord avoir au présent : « il a... »',
    explain: 'Présent + tampon = « il a mangé », c\'est le passé composé.'
  },
  {

    prompt: '« il <mark style="--tag:var(--orange)">mangeait</mark> » est à l\'imparfait. Quel temps composé obtient-on en posant le tampon dessus ?',
    options: ['passé composé','plus-que-parfait','futur antérieur','passé antérieur'],
    correct: 1,

    options: ['passé composé','plus-que-parfait','futur antérieur','passé antérieur'],
    correct: 3,
    hint: 'Conjugue avoir au passé simple, puis ajoute le participe passé.',
    ok: 'Le tampon est bien posé !',
    ko: 'Conjugue d\'abord avoir au passé simple : « il eut... »',
    explain: 'Passé simple + tampon = « il eut mangé », c\'est le passé antérieur.'
  }
];

let current = 0;
let answered = false;
let score = 0;
const results = new Array(questions.length).fill(null);

const progressEl = document.getElementById('progress');
const eyebrowEl = document.getElementById('eyebrow');
const promptEl = document.getElementById('prompt');
const optionsEl = document.getElementById('options');
const hintBtn = document.getElementById('hintBtn');
const hintText = document.getElementById('hintText');
const feedbackEl = document.getElementById('feedback');
const feedbackTitle = document.getElementById('feedbackTitle');
const feedbackText = document.getElementById('feedbackText');
const nextBtn = document.getElementById('nextBtn');
const stageEl = document.getElementById('stage');
const endEl = document.getElementById('end');

function buildProgress(){
  progressEl.innerHTML = '';
  questions.forEach((q,i)=>{
    const d = document.createElement('div');
    d.className = 'dot';
    d.textContent = i+1;
    d.id = 'dot-'+i;
    progressEl.appendChild(d);
  });
}

function refreshProgress(){
  questions.forEach((q,i)=>{
    const d = document.getElementById('dot-'+i);
    d.classList.remove('current','done-ok','done-ko');
    if(results[i]===true) d.classList.add('done-ok');
    else if(results[i]===false) d.classList.add('done-ko');
    else if(i===current) d.classList.add('current');
  });
}

function renderQuestion(){
  answered = false;
  const q = questions[current];
  eyebrowEl.textContent = 'question ' + (current+1) + ' sur ' + questions.length;
  promptEl.innerHTML = q.prompt;
  optionsEl.innerHTML = '';
  hintText.classList.remove('show');
  hintText.textContent = q.hint;
  hintBtn.textContent = 'voir un indice';
  feedbackEl.classList.remove('show','ok','ko');
  feedbackEl.querySelectorAll('.stamp-mark').forEach(s=>s.remove());
  nextBtn.classList.remove('active');
  nextBtn.textContent = current === questions.length-1 ? 'voir le score' : 'suivant';

  q.options.forEach((opt, idx)=>{
    const b = document.createElement('button');
    b.className = 'opt';
    b.type = 'button';
    b.textContent = opt;
    b.addEventListener('click', ()=>selectAnswer(idx));
    optionsEl.appendChild(b);
  });

  refreshProgress();
}

function selectAnswer(idx){
  if(answered) return;
  answered = true;
  const q = questions[current];
  const correct = idx === q.correct;
  results[current] = correct;
  if(correct) score++;

  const btns = optionsEl.querySelectorAll('.opt');
  btns.forEach((b,i)=>{
    b.disabled = true;
    if(i===q.correct) b.classList.add(correct ? 'correct' : 'reveal-correct');
    if(i===idx && !correct) b.classList.add('incorrect');
  });

  feedbackEl.classList.add('show', correct ? 'ok' : 'ko');
  feedbackTitle.textContent = correct ? q.ok : q.ko;
  feedbackText.textContent = q.explain;

  if(correct){
    const stamp = document.createElement('div');
    stamp.className = 'stamp-mark';
    stamp.textContent = 'TERMINÉ';
    feedbackEl.appendChild(stamp);
  }

  nextBtn.classList.add('active');
  refreshProgress();
}

hintBtn.addEventListener('click', ()=>{
  hintText.classList.toggle('show');
  hintBtn.textContent = hintText.classList.contains('show') ? 'cacher l\'indice' : 'voir un indice';
});

nextBtn.addEventListener('click', ()=>{
  if(!answered) return;
  if(current < questions.length - 1){
    current++;
    renderQuestion();
  } else {
    showEnd();
  }
});

function showEnd(){
  stageEl.style.display = 'none';
  document.querySelector('.legend').style.display = 'none';
  endEl.classList.add('show');
  document.getElementById('scoreBig').textContent = score + '/' + questions.length;
  let msg;
  if(score === questions.length) msg = 'Chaque tampon est bien posé : tu as trouvé tous les temps qui vont ensemble.';
  else if(score >= questions.length - 2) msg = 'Presque tous les tampons sont posés au bon endroit, bravo.';
  else msg = 'Encore quelques tampons à ajuster : reprends les explications et retente ta chance.';
  document.getElementById('endMsg').textContent = msg;
}

document.getElementById('restartBtn').addEventListener('click', ()=>{
  current = 0; score = 0; results.fill(null);
  stageEl.style.display = '';
  document.querySelector('.legend').style.display = '';
  endEl.classList.remove('show');
  renderQuestion();
});

buildProgress();
renderQuestion();
</script>
