<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Carte interactive pour apprendre les pays d'Europe à partir de 50 numéros.">
  <title>À la découverte des pays d’Europe</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%232d6a4f'/%3E%3Cpath d='M18 18l10-7 7 5 10 1 5 10-7 7 1 12-12 7-6-10-10-5 4-8z' fill='%23ffd166'/%3E%3C/svg%3E">
  <style>
    :root { --ink:#17324d; --blue:#22577a; --green:#2d6a4f; --lime:#95d5b2; --yellow:#ffd166; --paper:#f8fbff; --red:#c44536; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:"Trebuchet MS", Arial, sans-serif; color:var(--ink); background:linear-gradient(135deg,#d9f2ff 0%,#f8fbff 42%,#fff4cc 100%); }
    header { padding:18px clamp(16px,3vw,36px) 12px; display:flex; gap:18px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
    h1 { margin:0; font-size:clamp(1.45rem,3vw,2.35rem); line-height:1.1; color:#163d5c; }
    header p { margin:6px 0 0; font-size:1rem; }
    .progress { min-width:220px; background:white; border:2px solid #b8d8e8; border-radius:18px; padding:10px 14px; box-shadow:0 5px 18px #22577a18; }
    .progress-row { display:flex; justify-content:space-between; font-weight:700; }
    .bar { height:10px; background:#e5eef3; border-radius:9px; overflow:hidden; margin-top:7px; }
    .bar > span { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--green),#52b788); transition:width .25s; }
    main { display:grid; grid-template-columns:minmax(320px,1fr) minmax(290px,400px); gap:20px; padding:0 clamp(12px,3vw,36px) 28px; align-items:start; }
    .map-card,.quiz-card { background:#ffffffdd; border:2px solid #b8d8e8; border-radius:24px; box-shadow:0 14px 40px #17405d22; overflow:hidden; }
    .map-wrap { position:relative; width:100%; line-height:0; background:white; }
    .map-wrap img { display:block; width:100%; height:auto; }
    .hotspot { position:absolute; width:3.2%; aspect-ratio:1; transform:translate(-50%,-50%); border:0; border-radius:50%; background:transparent; cursor:pointer; padding:0; }
    .hotspot:hover,.hotspot:focus-visible { outline:3px solid var(--yellow); background:#ffd166aa; box-shadow:0 0 0 5px #22577a55; }
    .hotspot.done { background:#52b78899; outline:2px solid white; }
    .map-note { padding:10px 16px 13px; line-height:1.4; font-size:.92rem; color:#496477; background:#f7fbfd; }
    .quiz-card { position:sticky; top:14px; padding:22px; min-height:440px; }
    .quiz-card h2 { margin:0 0 8px; font-size:1.45rem; }
    .number-chip { display:inline-flex; align-items:center; justify-content:center; width:48px; height:48px; border-radius:50%; background:var(--yellow); color:#263238; font-weight:900; font-size:1.25rem; margin-bottom:14px; }
    .instruction { line-height:1.5; margin:0 0 18px; }
    .answers { display:grid; gap:10px; }
    .answer { width:100%; text-align:left; border:2px solid #b8d8e8; background:white; color:var(--ink); border-radius:14px; padding:13px 15px; font:700 1rem/1.25 inherit; cursor:pointer; transition:transform .12s, border-color .12s, background .12s; }
    .answer:hover:not(:disabled),.answer:focus-visible { transform:translateY(-1px); border-color:var(--blue); background:#eef8ff; outline:none; }
    .answer.correct { border-color:var(--green); background:#d8f3dc; }
    .answer.wrong { border-color:var(--red); background:#ffe1dc; }
    .answer:disabled { cursor:default; color:var(--ink); }
    .feedback { min-height:54px; margin:16px 0 0; border-radius:14px; padding:12px 14px; font-weight:700; line-height:1.35; }
    .feedback:empty { padding:0; }
    .feedback.good { background:#d8f3dc; color:#175c3a; }
    .feedback.bad { background:#ffe1dc; color:#8f261d; }
    .empty { display:grid; place-items:center; min-height:390px; text-align:center; padding:20px; }
    .empty .globe { font-size:4rem; margin-bottom:10px; }
    .reset { margin-top:14px; border:0; border-radius:12px; padding:10px 14px; background:#e8f2f7; color:#24495f; font-weight:700; cursor:pointer; }
    @media (max-width:850px) { main { grid-template-columns:1fr; } .quiz-card { position:static; min-height:0; order:-1; } .empty { min-height:220px; } .hotspot { width:5%; } }
  </style>
</head>

      [22,"Finlande",[21,45],67.3,44.9],[23,"Estonie",[24,22],69.0,53.1],[24,"Lettonie",[23,25],68.9,56.8],
      [25,"Lituanie",[24,26],65.8,59.8],[26,"Pologne",[12,27],56.8,65.7],[27,"Tchéquie",[12,28],51.8,70.0],
      [28,"Autriche",[12,33],51.0,74.0],[29,"Slovénie",[15,30],53.0,76.7],[30,"Croatie",[29,31],54.3,77.1],
      [31,"Bosnie-Herzégovine",[30,34],56.1,79.4],[32,"Slovaquie",[27,33],58.7,71.6],[33,"Hongrie",[28,34],58.7,74.8],
      [34,"Serbie",[31,41],60.7,79.4],[35,"Monténégro",[30,36],58.5,82.0],[36,"Albanie",[35,39],59.7,85.2],
      [37,"Kosovo",[34,36],61.0,82.3],[38,"Macédoine du Nord",[36,39],62.8,82.7],[39,"Grèce",[36,40],62.3,86.3],
      [40,"Bulgarie",[39,41],67.4,82.0],[41,"Roumanie",[40,33],67.0,77.3],[42,"Ukraine",[26,41],77.7,70.5],
      [43,"Moldavie",[41,42],73.3,74.6],[44,"Biélorussie",[26,45],72.1,63.6],[45,"Russie",[22,42],84.2,52.7],
      [46,"Azerbaïdjan",[47,48],89.0,89.5],[47,"Arménie",[46,48],89.0,87.8],[48,"Géorgie",[45,47],89.0,86.1],
      [49,"Turquie",[39,40],80.0,87.6],[50,"Chypre",[49,39],76.0,94.0]
    ].map(([id,name,neighbors,x,y])=>({id,name,neighbors,x,y}));
    const byId = Object.fromEntries(countries.map(c=>[c.id,c]));
    const played = new Map(); let score = 0;
    const map = document.querySelector('#map'), quiz = document.querySelector('#quiz');

    function shuffle(items){ return [...items].sort(()=>Math.random()-.5); }
    function typo(word, seed){
      const accents = {"Tchéquie":"Tchèquie","Macédoine du Nord":"Macèdoine du Nord","Biélorussie":"Bielorussie","Azerbaïdjan":"Azerbaidjan","Géorgie":"Georgie","Grèce":"Gréce","Suède":"Suéde","Monténégro":"Montenégro"};
      if(accents[word]) return accents[word];
      const chars=[...word]; const letters=chars.map((c,i)=>/[A-Za-zÀ-ÿ]/.test(c)?i:-1).filter(i=>i>1&&i<chars.length-2);
      let i=letters[(seed*3+word.length)%letters.length] ?? Math.max(2,Math.floor(chars.length/2));
      if(chars[i]!==chars[i+1] && /[A-Za-zÀ-ÿ]/.test(chars[i+1]||'')) [chars[i],chars[i+1]]=[chars[i+1],chars[i]];
      else chars.splice(i,1);
      return chars.join('');
    }
    function updateProgress(){
      document.querySelector('#score').textContent=`Score : ${score}`;
      document.querySelector('#count').textContent=`${played.size} / 50`;
      document.querySelector('#bar').style.width=`${played.size*2}%`;
    }
    function openQuiz(country){
      const neighbors=shuffle(country.neighbors).slice(0,2).map(id=>byId[id]);
      const trio=[country,...neighbors];
      const misspelled=shuffle(trio).slice(0,2).map((c,i)=>typo(c.name,country.id+i));
      const options=shuffle([...trio.map(c=>c.name),...misspelled]);
      quiz.innerHTML=`<div class="number-chip">${country.id}</div><h2>Quel est ce pays ?</h2><p class="instruction">Une seule réponse est correctement écrite et correspond au numéro <strong>${country.id}</strong>.</p><div class="answers">${options.map(o=>`<button class="answer" type="button" data-value="${o.replaceAll('"','&quot;')}">${o}</button>`).join('')}</div><div class="feedback" id="feedback"></div><button class="reset" type="button" id="reset">Revoir la consigne</button>`;
      quiz.querySelectorAll('.answer').forEach(btn=>btn.addEventListener('click',()=>answer(country,btn)));
      quiz.querySelector('#reset').addEventListener('click',()=>openQuiz(country));
      if(window.innerWidth<851) quiz.scrollIntoView({behavior:'smooth',block:'start'});
    }
    function answer(country,selected){
      const buttons=[...quiz.querySelectorAll('.answer')]; buttons.forEach(b=>b.disabled=true);
      const right=selected.dataset.value===country.name;
      buttons.find(b=>b.dataset.value===country.name)?.classList.add('correct');
      if(!right) selected.classList.add('wrong');
      if(!played.has(country.id)){ played.set(country.id,right); if(right) score++; document.querySelector(`[data-id="${country.id}"]`).classList.add('done'); updateProgress(); }
      const feedback=quiz.querySelector('#feedback'); feedback.className=`feedback ${right?'good':'bad'}`;
      feedback.textContent=right?`Bravo ! Le numéro ${country.id} correspond bien à ${country.name}.`:`Presque ! Le numéro ${country.id} correspond à ${country.name}.`;
    }
    countries.forEach(c=>{
      const b=document.createElement('button'); b.type='button'; b.className='hotspot'; b.dataset.id=c.id;
      b.style.left=`${c.x}%`; b.style.top=`${c.y}%`; b.setAttribute('aria-label',`Question sur le pays numéro ${c.id}`);
      b.addEventListener('click',()=>openQuiz(c)); map.appendChild(b);
    });
    updateProgress();
  </script>
</body>
</html>
